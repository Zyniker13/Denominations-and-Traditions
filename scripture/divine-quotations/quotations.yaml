# Places where God himself speaks the words of earlier Scripture.
#
# This file is the curated input. quotations.md and quotations.json are
# generated from it, with the Greek and Hebrew texts filled in, by
# tools/build_divine_quotations.py, which also checks every quotation and
# every reading below against the texts. Edit this file, then re-run the
# tool; do not edit the generated files by hand. The study is in
# analysis/god-quoting-scripture/README.md.
#
# New Testament fields
#   id          stable identifier
#   at          where the quotation is spoken (USFM codes, eBible.org numbering)
#   speaker     jesus | jesus-risen | father | god (the one on the throne)
#   saying      shared by the Gospel parallels of one saying, so that
#               occurrences can be counted and distinct sayings merged
#   source      the Old Testament text quoted, by English chapter and verse
#   mt, lxx     the Hebrew (Masoretic) and Septuagint (Brenton) references
#               where their numbering differs from the English
#   og_find     Daniel only: words that locate the Old Greek sentence in
#               Swete's text (Brenton's Daniel is Theodotion)
#   formula     the words that introduce the quotation as Scripture or as
#               spoken, where there are any
#   type        direct      the words of the source, verbatim or nearly so;
#                           trimmed at the edges, with no more than a
#                           particle, article or pronoun changed
#               adapted     recognizably the source's wording, but abridged,
#                           reordered, changed in person, mood or number, or
#                           with words substituted
#               paraphrase  the source's content in largely other words, or
#                           a summary of a law
#   composite   two or more texts fused in one citation
#   borderline  left out of the strict count: no formula, and either a short
#               phrase or a likeness that could be an allusion
#   only        editions that alone contain the quotation (tr, byz)
#   quote       the quoted words, as in the SBL text (or in the first
#               edition named in `only`); "…" marks an omission
#   affinity    lxx          agrees with the Septuagint (Swete's text, and
#                            Brenton unless noted) where the Hebrew differs
#               lxx-wording  reproduces the Septuagint's wording; the Hebrew
#                            agrees in sense
#               other-greek  agrees with another Greek witness
#                            (Alexandrinus, Sinaiticus, Theodotion, the
#                            Hexaplaric versions) where Swete's text and
#                            Brenton differ from it
#               mt           agrees with the Hebrew where the Septuagint
#                            differs, in wording no Greek witness shares
#               mixed        the Septuagint at one point, the Hebrew or
#                            another witness at another
#               varies       depends on the edition of the New Testament
#               independent  agrees with neither against the other
#               undetermined the Septuagint and the Hebrew agree and the
#                            Greek is what any literal rendering would give
#               semitic      the text gives the words in a Semitic form and
#                            renders them into Greek
#               In Daniel "the Septuagint" is the Old Greek; Theodotion is
#               another Greek witness.
#   points      the readings that decide the affinity:
#                 nt      the New Testament's reading
#                 lxx     Brenton's reading ("—" if Brenton has nothing there)
#                 swete   Swete's reading where it differs from Brenton (in
#                         Daniel, the Old Greek)
#                 mt      the Hebrew
#                 other   other witnesses, from Swete's apparatus or Field
#                 with    the witnesses the New Testament agrees with at
#                         this point (see SIGLA in the tool)
#   editions    how the three Greek New Testament editions differ
#   note        anything else. [context] marks history outside the texts;
#               [inferred] marks this study's own reading.
#
# Old Testament fields
#   id, at, speaker (god-ot | god-through-prophet | angel-of-the-lord),
#   group       headline | torah | intra-book | parallel
#   source      the earlier passage (Hebrew numbering)
#   formula     the Hebrew words that mark the repetition, if any
#   type        as above
#   borderline  as above
#   quote       the words of `at` that repeat the source (Hebrew)
#   source_words  the matching words of the source (Hebrew)
#   lxx         Brenton's reference for `at` where it differs, or "—"
#               where the Septuagint lacks the passage
#   lxx_source  Brenton's reference for `source` where it differs, or "—"
#   greek       whether the Septuagint keeps the verbal link between the
#               two passages: yes | partly | no; nolink (the Hebrew shares
#               no wording either); absent (the Septuagint lacks the
#               quoting passage); source-absent (it lacks the source)
#   note

new_testament:

# ================================================================ Matthew

- id: matt-4-4
  at: MAT 4:4
  speaker: jesus
  saying: bread-alone
  source: DEU 8:3
  formula: Γέγραπται
  type: direct
  quote: Οὐκ ἐπʼ ἄρτῳ μόνῳ ζήσεται ὁ ἄνθρωπος, ἀλλʼ ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ
  affinity: lxx-wording
  points:
    - nt: ἐπὶ παντὶ ῥήματι
      lxx: ἐπὶ παντὶ ῥήματι
      mt: עַל־כָּל־מוֹצָא
      other: the Hebrew has "every thing that goes out"; the Greek names it a word
      with: [lxx]
    - nt: στόματος θεοῦ
      lxx: στόματος θεοῦ
      mt: פִי־יְהוָה
      other: θεός for the divine name is the Septuagint's rendering here
      with: [lxx]
    - nt: ῥήματι ἐκπορευομένῳ
      lxx: ῥήματι τῷ ἐκπορευομένῳ
      other: A F omit τῷ (Swete's apparatus)
      with: [A, F]
  editions: The TR and Byz lack ὁ before ἄνθρωπος; the Septuagint has it.

- id: luke-4-4
  at: LUK 4:4
  speaker: jesus
  saying: bread-alone
  source: DEU 8:3
  formula: Γέγραπται ὅτι
  type: direct
  quote: Οὐκ ἐπʼ ἄρτῳ μόνῳ ζήσεται ὁ ἄνθρωπος
  affinity: undetermined
  editions: The SBL text quotes only the first clause. The TR adds ἀλλʼ ἐπὶ παντὶ ῥήματι θεοῦ and the Byz ἀλλʼ ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ, the Septuagint's wording, as in Matthew.

- id: matt-4-7
  at: MAT 4:7
  speaker: jesus
  saying: do-not-tempt
  source: DEU 6:16
  formula: Πάλιν γέγραπται
  type: direct
  quote: Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου
  affinity: lxx
  points:
    - nt: Οὐκ ἐκπειράσεις
      lxx: Οὐκ ἐκπειράσεις
      mt: לֹא תְנַסּוּ
      other: the Hebrew is plural, "you (all) shall not test"; the Greek is singular
      with: [lxx]
    - nt: κύριον τὸν θεόν σου
      lxx: Κύριον τὸν Θεόν σου
      mt: אֶת־יְהוָה אֱלֹהֵיכֶם
      other: the Hebrew has "your (plural) God"
      with: [lxx]

- id: luke-4-12
  at: LUK 4:12
  speaker: jesus
  saying: do-not-tempt
  source: DEU 6:16
  formula: Εἴρηται
  type: direct
  quote: Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου
  affinity: lxx
  points:
    - nt: Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου
      lxx: Οὐκ ἐκπειράσεις Κύριον τὸν Θεόν σου
      mt: לֹא תְנַסּוּ אֶת־יְהוָה אֱלֹהֵיכֶם
      other: singular against the Hebrew plural, as in Matthew 4:7
      with: [lxx]

- id: matt-4-10
  at: MAT 4:10
  speaker: jesus
  saying: worship-him-only
  source: DEU 6:13
  formula: γέγραπται γάρ
  type: adapted
  quote: Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις
  affinity: other-greek
  points:
    - nt: προσκυνήσεις
      lxx: φοβηθήσῃ
      mt: תִּירָא
      other: A reads προσκυνήσεις (Swete's apparatus)
      with: [A]
    - nt: αὐτῷ μόνῳ λατρεύσεις
      lxx: αὐτῷ μόνῳ λατρεύσεις
      swete: αὐτῷ λατρεύσεις
      mt: וְאֹתוֹ תַעֲבֹד
      other: B and the Hebrew have no "only"; A adds μόνῳ, and so does Brenton's text
      with: [A, brenton]
  note: The wording is A's exactly. Swete's B and the Hebrew read "fear" and lack "only". [context] Whether A's text was assimilated to the Gospels or the Gospels drew on a text like A's cannot be told from the texts themselves. Deuteronomy 10:20 has the same sentence; there too B reads φοβηθήσῃ.

- id: luke-4-8
  at: LUK 4:8
  speaker: jesus
  saying: worship-him-only
  source: DEU 6:13
  formula: Γέγραπται
  type: adapted
  quote: Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις
  affinity: other-greek
  points:
    - nt: προσκυνήσεις
      lxx: φοβηθήσῃ
      mt: תִּירָא
      other: A reads προσκυνήσεις
      with: [A]
    - nt: αὐτῷ μόνῳ λατρεύσεις
      lxx: αὐτῷ μόνῳ λατρεύσεις
      swete: αὐτῷ λατρεύσεις
      mt: וְאֹתוֹ תַעֲבֹד
      other: A and Brenton add μόνῳ
      with: [A, brenton]
  editions: The TR puts the verb first, Προσκυνήσεις Κύριον τὸν Θεόν σου.

- id: matt-5-5
  at: MAT 5:5
  speaker: jesus
  saying: meek-inherit
  source: PSA 37:11
  lxx: PSA 36:11
  type: direct
  quote: οἱ πραεῖς … κληρονομήσουσι τὴν γῆν
  affinity: lxx-wording
  points:
    - nt: οἱ πραεῖς … κληρονομήσουσι τὴν γῆν
      lxx: πρᾳεῖς κληρονομήσουσι γῆν
      swete: πρᾳεῖς κληρονομήσουσιν τὴν γῆν
      mt: וַעֲנָוִים יִירְשׁוּ־אָרֶץ
      other: Swete's B has the article; Brenton and the Göttingen edition do not, and neither does the Hebrew
      with: [B]
  note: Embedded in a beatitude without a formula, but the clause is Swete's text of the Psalm word for word.

- id: matt-5-21
  at: MAT 5:21
  speaker: jesus
  saying: antithesis-murder
  source: EXO 20:13, DEU 5:17
  lxx: EXO 20:15, DEU 5:17
  formula: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις
  type: direct
  quote: Οὐ φονεύσεις
  affinity: undetermined
  note: The second clause, "whoever murders shall be liable to judgment", sums up the penalty laws (Exodus 21:12; Numbers 35:16-31) in other words and is not counted as a quotation.

- id: matt-5-27
  at: MAT 5:27
  speaker: jesus
  saying: antithesis-adultery
  source: EXO 20:14, DEU 5:18
  lxx: EXO 20:13, DEU 5:18
  formula: Ἠκούσατε ὅτι ἐρρέθη
  type: direct
  quote: Οὐ μοιχεύσεις
  affinity: undetermined
  editions: The TR and Byz add τοῖς ἀρχαίοις to the formula.

- id: matt-5-31
  at: MAT 5:31
  speaker: jesus
  saying: antithesis-divorce
  source: DEU 24:1
  formula: Ἐρρέθη δέ
  type: paraphrase
  quote: Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον
  affinity: lxx-wording
  points:
    - nt: ἀποστάσιον
      lxx: βιβλίον ἀποστασίου
      mt: סֵפֶר כְּרִיתֻת
      other: ἀποστάσιον is the Septuagint's word for the bill of divorce
      with: [lxx]

- id: matt-5-33
  at: MAT 5:33
  speaker: jesus
  saying: antithesis-oaths
  source: LEV 19:12, NUM 30:2, DEU 23:21
  mt: LEV 19:12, NUM 30:3, DEU 23:22
  lxx: LEV 19:12, NUM 30:3, DEU 23:22
  formula: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις
  type: paraphrase
  composite: true
  quote: Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου
  affinity: independent
  note: No source has these words; the sentence sums up the laws against false swearing and for keeping vows.

- id: matt-5-38
  at: MAT 5:38
  speaker: jesus
  saying: antithesis-eye
  source: EXO 21:24, LEV 24:20, DEU 19:21
  formula: Ἠκούσατε ὅτι ἐρρέθη
  type: direct
  composite: true
  quote: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος
  affinity: lxx-wording
  points:
    - nt: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
      lxx: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
      mt: עַיִן תַּחַת עַיִן
      other: the accusative stands without a verb, as in Exodus 21:24 and Deuteronomy 19:21 in the Septuagint, where it depends on "he shall give"
      with: [lxx]

- id: matt-5-43
  at: MAT 5:43
  speaker: jesus
  saying: antithesis-neighbour
  source: LEV 19:18
  formula: Ἠκούσατε ὅτι ἐρρέθη
  type: adapted
  quote: Ἀγαπήσεις τὸν πλησίον σου
  affinity: undetermined
  note: The second clause, "and you shall hate your enemy", is not in the Old Testament; the text gives it as what was said, not as written.

- id: matt-6-6
  at: MAT 6:6
  speaker: jesus
  saying: enter-your-room
  source: ISA 26:20
  type: adapted
  borderline: true
  quote: εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου
  affinity: lxx-wording
  points:
    - nt: εἴσελθε εἰς τὸ ταμεῖόν σου
      lxx: εἴσελθε εἰς τὰ ταμεῖά σου
      mt: בֹּא בַחֲדָרֶיךָ
      with: [lxx]
    - nt: τὴν θύραν σου
      lxx: τὴν θύραν σου
      mt: דלתיך
      other: the Hebrew is written as a plural or dual, "your doors"; the Greek is singular
      with: [lxx]

- id: matt-7-23
  at: MAT 7:23
  speaker: jesus
  saying: depart-from-me
  source: PSA 6:8
  mt: PSA 6:9
  lxx: PSA 6:9
  type: adapted
  quote: ἀπʼ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν
  affinity: lxx-wording
  points:
    - nt: οἱ ἐργαζόμενοι τὴν ἀνομίαν
      lxx: οἱ ἐργαζόμενοι τὴν ἀνομίαν
      mt: פֹּעֲלֵי אָוֶן
      with: [lxx]
    - nt: ἀποχωρεῖτε
      lxx: Ἀπόστητε
      mt: סוּרוּ
      with: [none]

- id: luke-13-27
  at: LUK 13:27
  speaker: jesus
  saying: depart-from-me
  source: PSA 6:8
  mt: PSA 6:9
  lxx: PSA 6:9
  type: adapted
  quote: ἀπόστητε ἀπʼ ἐμοῦ, πάντες ἐργάται ἀδικίας
  affinity: lxx-wording
  points:
    - nt: ἀπόστητε ἀπʼ ἐμοῦ πάντες
      lxx: Ἀπόστητε ἀπʼ ἐμοῦ πάντες
      mt: סוּרוּ מִמֶּנִּי כָּל
      with: [lxx]
    - nt: ἐργάται ἀδικίας
      lxx: οἱ ἐργαζόμενοι τὴν ἀνομίαν
      mt: פֹּעֲלֵי אָוֶן
      other: Luke's own words for "workers of iniquity"
      with: [none]
  editions: The TR and Byz read οἱ ἐργάται τῆς ἀδικίας.
  note: Luke has the Psalm's first four words exactly; Matthew 7:23 has its last four.

- id: matt-9-13
  at: MAT 9:13
  speaker: jesus
  saying: mercy-not-sacrifice-1
  source: HOS 6:6
  formula: πορευθέντες δὲ μάθετε τί ἐστιν
  type: direct
  quote: Ἔλεος θέλω καὶ οὐ θυσίαν
  affinity: other-greek
  points:
    - nt: καὶ οὐ θυσίαν
      lxx: ἢ θυσίαν
      mt: וְלֹא־זָבַח
      other: A and Q (first hand) read καὶ οὐ (Swete's apparatus)
      with: [A, Q, mt]
  editions: The TR and Byz have the masculine form ἔλεον.
  note: The Hebrew says "and not sacrifice"; B and Brenton say "rather than sacrifice". Matthew has the Hebrew's sense in the wording of A and Q.

- id: matt-10-35
  at: MAT 10:35-36
  speaker: jesus
  saying: household-enemies
  source: MIC 7:6
  type: adapted
  quote: θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς, καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ
  affinity: mt
  points:
    - nt: ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ
      lxx: ἐχθροὶ πάντες ἀνδρὸς οἱ ἐν τῷ οἴκῳ αὐτοῦ
      mt: אֹיְבֵי אִישׁ אַנְשֵׁי בֵיתוֹ
      other: the Septuagint adds "all"; the Hebrew and Matthew do not
      with: [mt]
  note: Matthew recasts the first half as Jesus' purpose ("I came to set … against …"), so the type is adapted. The agreement with the Hebrew rests on a single word.

- id: luke-12-53
  at: LUK 12:53
  speaker: jesus
  saying: household-enemies
  source: MIC 7:6
  type: paraphrase
  borderline: true
  quote: θυγάτηρ ἐπὶ τὴν μητέρα, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν πενθεράν
  affinity: lxx-wording
  points:
    - nt: νύμφη ἐπὶ τὴν πενθεράν
      lxx: νύμφη ἐπὶ τὴν πενθερὰν αὐτῆς
      mt: כַּלָּה בַּחֲמֹתָהּ
      other: ἐπί, as in the Septuagint; Matthew has κατά
      with: [lxx]
  editions: The TR and Byz read μήτηρ ἐπὶ θυγατρί, καὶ θυγάτηρ ἐπὶ μητρί, and add αὐτῆς at the end.
  note: Luke makes Micah's one-way list into pairs set against each other, so it is counted as a paraphrase.

- id: matt-11-10
  at: MAT 11:10
  speaker: jesus
  saying: messenger-before-you
  source: MAL 3:1, EXO 23:20
  formula: οὗτός ἐστιν περὶ οὗ γέγραπται
  type: adapted
  composite: true
  quote: Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου
  affinity: mixed
  points:
    - nt: Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου
      lxx: ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου
      mt: הִנֵּה אָנֹכִי שֹׁלֵחַ מַלְאָךְ לְפָנֶיךָ
      other: Exodus 23:20 in the Septuagint, word for word. The Hebrew of Exodus has "a messenger"; Malachi's Hebrew has "my messenger"
      with: [lxx]
    - nt: κατασκευάσει τὴν ὁδόν
      lxx: ἐπιβλέψεται ὁδὸν
      mt: וּפִנָּה־דֶרֶךְ
      other: the Hebrew is "he will clear (prepare) the way"; the Septuagint read "he will look upon". Field gives Aquila σχολάσει and Theodotion ἑτοιμάσει, both in the Hebrew's sense in other words. Symmachus survives only in the Syriac, which Middeldorpf put back into Greek as κατασκευάσει and Field as ἀποσκευάσει; no extant Greek witness has κατασκευάσει
      with: [mt]
    - nt: ἔμπροσθέν σου
      lxx: πρὸ προσώπου μου
      mt: לְפָנָי
      other: Malachi has "before me" in both texts
      with: [none]
  editions: The TR and Byz begin the verse οὗτος γάρ.

- id: luke-7-27
  at: LUK 7:27
  speaker: jesus
  saying: messenger-before-you
  source: MAL 3:1, EXO 23:20
  formula: οὗτός ἐστιν περὶ οὗ γέγραπται
  type: adapted
  composite: true
  quote: Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου
  affinity: mixed
  points:
    - nt: ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου
      lxx: ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου
      mt: שֹׁלֵחַ מַלְאָךְ לְפָנֶיךָ
      other: Exodus 23:20 in the Septuagint
      with: [lxx]
    - nt: κατασκευάσει τὴν ὁδόν
      lxx: ἐπιβλέψεται ὁδὸν
      mt: וּפִנָּה־דֶרֶךְ
      other: the Hebrew's sense, as in Matthew 11:10
      with: [mt]
  editions: The SBL lacks ἐγώ after Ἰδού; the TR and Byz have it, as the Septuagint of Exodus 23:20 does.

- id: matt-11-23
  at: MAT 11:23
  speaker: jesus
  saying: capernaum-hades
  source: ISA 14:13-15
  type: adapted
  borderline: true
  quote: ἕως οὐρανοῦ ὑψωθήσῃ ; ἕως ᾅδου καταβήσῃ
  affinity: varies
  points:
    - nt: καταβήσῃ
      lxx: καταβήσῃ
      mt: תּוּרָד
      other: the Hebrew is passive, "you will be brought down"
      with: [lxx]
    - nt: καταβιβασθήσῃ
      lxx: καταβήσῃ
      mt: תּוּרָד
      other: the TR and Byz have the passive, as the Hebrew
      with: [mt]
  editions: The SBL text reads καταβήσῃ ("you will go down"), the Septuagint's verb; the TR and Byz read καταβιβασθήσῃ ("you will be brought down"), the Hebrew's passive. The TR and Byz also read ἡ ἕως τοῦ οὐρανοῦ ὑψωθεῖσα ("you who are exalted") for the SBL's question.

- id: luke-10-15
  at: LUK 10:15
  speaker: jesus
  saying: capernaum-hades
  source: ISA 14:13-15
