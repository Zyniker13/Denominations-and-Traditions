  speaker: god-ot
  group: headline
  source: DEU 11:24
  formula: כַּאֲשֶׁר דִּבַּרְתִּי אֶל־מֹשֶׁה
  type: adapted
  quote: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ לָכֶם … נְהַר פְּרָת … וְעַד הַיָּם
  source_words: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ לָכֶם … נְהַר פְּרָת … וְעַד הַיָּם
  greek: partly
  note: Moses' words in Deuteronomy, which the LORD calls his own ("as I said to Moses"), turned from "you" to the people into "you" to Joshua.

- id: josh-1-5
