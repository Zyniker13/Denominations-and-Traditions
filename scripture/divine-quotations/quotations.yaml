  type: adapted
  composite: true
  quote: לֹא אָפֵר בְּרִיתִי … לֹא תִכְרְתוּ בְרִית לְיוֹשְׁבֵי הָאָרֶץ … תִּתֹּצוּן
  source_words: תִּכְרֹת בְּרִית לְיוֹשֵׁב הָאָרֶץ … תִּתֹּצוּן … לְהָפֵר בְּרִיתִי
  greek: partly
  note: The Angel of the LORD speaks as the LORD ("I brought you up … I said"). What he says he said is the Sinai warning against covenants with the land's inhabitants and the command to break down their altars.

