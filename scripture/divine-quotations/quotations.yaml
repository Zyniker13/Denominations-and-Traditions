  source_words: עַל הֶהָרִים רַגְלֵי מְבַשֵּׂר מַשְׁמִיעַ שָׁלוֹם
  greek: partly
  note: Nahum 2:1 is English Nahum 1:15. Isaiah is dated by its first verse to the kings from Uzziah to Hezekiah. Nahum's book carries no date; [context] the fall of Thebes, which it speaks of as past (3:8), happened in 663 BC, after Hezekiah. Many critics date Isaiah 52 after Nahum; this study follows the books' own superscriptions.

