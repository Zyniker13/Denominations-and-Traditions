  source_words: מַכֵּה נֶפֶשׁ בִּשְׁגָגָה … וְהָיוּ לָכֶם … לְמִקְלָט מִגֹּאֵל
  greek: partly
  note: '"Which I spoke to you by the hand of Moses." The Septuagint of Joshua 20 is shorter than the Hebrew (it lacks 20:4-6), but it keeps these verses.'

- id: judg-2-1
