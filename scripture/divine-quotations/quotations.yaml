  type: adapted
  composite: true
  quote: לֹא יִתְיַצֵּב אִישׁ … אֶהְיֶה עִמָּךְ לֹא … חֲזַק וֶאֱמָץ כִּי אַתָּה … אֶת הָעָם הַזֶּה
  source_words: חֲזַק וֶאֱמָץ כִּי אַתָּה … אֶת הָעָם הַזֶּה … אֶהְיֶה עִמָּךְ … לֹא יִתְיַצֵּב אִישׁ
  greek: partly
  note: The charge Moses gave Joshua (Deuteronomy 31:7-8) and the LORD's own charge to him (31:23), repeated by the LORD, who names "this book of the law" (1:8) as what Joshua is to keep.

- id: josh-20-2
