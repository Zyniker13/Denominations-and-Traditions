  source_words: הַיּוֹשֶׁבֶת לָבֶטַח הָאֹמְרָה בִּלְבָבָהּ אֲנִי וְאַפְסִי עוֹד
  greek: yes
  note: Babylon's boast in Isaiah, put in Nineveh's mouth. [context] As with Nahum, critics who date Isaiah 47 to the exile reverse the direction; this study follows the superscriptions (Isaiah 1:1; Zephaniah 1:1).

