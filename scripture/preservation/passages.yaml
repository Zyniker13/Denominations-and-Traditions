# ---------------------------------------------------------------- Isaiah

- id: isa-8-16
  ref: Isaiah 8:16, 20
  kjv: ISA 8:16, ISA 8:20
  speaker: god-through-prophet
  role: means
  categories: [custody]
  object: the testimony and the law
  claim: Bind up the testimony, seal the law among my disciples. To the law and to the testimony; if they speak not according to this word, it is because there is no light in them.
  mt_lxx: |
    The two texts have different meanings. The Hebrew of 8:16 commands the
    testimony to be bound and sealed "among my disciples" (בְּלִמֻּדָי). The
    Greek reads "Then shall those who seal up the law, that they may not learn
    it, be made manifest." In 8:20 the Greek has "he has given the law for a
    help", not the Hebrew's appeal "to the law and to the testimony".
  notes: Westminster cites 8:20 (WCF 1.1, 1.8; WLC Q. 3) for the appeal to Scripture; that reading depends on the Hebrew.

- id: isa-9-8
  ref: Isaiah 9:8
  kjv: ISA 9:8
  mt: ISA 9:7
  lxx: ISA 9:7
  speaker: god-through-prophet
  role: claim
  categories: [efficacy]
  object: a word sent into Jacob
  claim: The Lord sent a word into Jacob, and it hath lighted (fallen) upon Israel.
  mt_lxx: |
    The Hebrew consonants דבר are pointed דָּבָר, "a word". The Greek read the
    same letters as דֶּבֶר, "pestilence": "The Lord sent death (θάνατον) upon
    Jacob." A preservation passage that exists only on one vocalization of
    the consonantal text.
  notes: |
    The word "falls" on Israel (נָפַל), the opposite of the idiom in which
    God's word does not fall to the ground; here it falls by landing on its
    target.

- id: isa-14-24
  ref: Isaiah 14:24, 27; 44:26
  kjv: ISA 14:24, ISA 14:27, ISA 44:26
  speaker: god-through-prophet
  role: claim
  categories: [fulfilment]
  object: God's purpose; the word of his servant
  claim: |
    "As I have purposed, so shall it stand"; "who shall disannul it?"; he
    "confirmeth the word of his servant, and performeth the counsel of his
    messengers".
  mt_lxx: |
    The Greek of 14:24 has no oath ("Thus saith the Lord of hosts" for "The
    LORD of hosts hath sworn") and renders "so shall it stand" (תָקוּם) as "so
    shall it abide" (μενεῖ), the verb of Isaiah 40:8 in the Greek. In 44:26
    "confirmeth the word" is ἱστῶν ῥῆμα, "establishing the word".
  notes: The word of the prophet ("his servant", "his messengers") is made to stand (מֵקִים) by God.

- id: isa-29-11
  ref: Isaiah 29:10-14
  kjv: ISA 29:10-14
  speaker: god-through-prophet
  role: warning
  categories: [withdrawal, corruption]
  object: the vision of all; the fear of God taught by men
  claim: |
    The vision is become as the words of a sealed book that neither learned
    nor unlearned can read; "their fear toward me is taught by the precept of
    men".
  mt_lxx: |
    The Greek of 29:11 reads "all these words" for "the vision of all", and
    29:13 adds "in vain do they worship me, teaching the commandments and
    doctrines of men" (μάτην δὲ σέβονταί με …). Jesus quotes 29:13 in that
    Greek form.
  nt_use: [MAT 15:8-9, MAR 7:6-7, ROM 11:8, 1CO 1:19]
  notes: |
    The word is present as a book but closed to its readers, a judgment of
    blindness rather than a loss of the text. Verse 13 is the passage Jesus
    applies to the tradition that "made the word of God of none effect"
    ([Matthew 15:6](#matt-15-6)).

- id: isa-30-8
  ref: Isaiah 30:8
  kjv: ISA 30:8
  speaker: god-through-prophet
  role: means
  categories: [inscripturation]
  object: the prophecy against trust in Egypt
  claim: Write it in a table, note it in a book, that it may be for the time to come for ever and ever.
  mt_lxx: |
    The Hebrew consonants לעד are pointed in the Masoretic Text as לָעַד, "for
    ever", giving "for the latter day, for ever, to eternity". Read as לְעֵד, the
    same letters mean "for a witness", which many modern versions adopt
    **[context]**. The Greek has "for many days, and even for ever" (εἰς
    ἡμέρας … καὶ ἕως εἰς τὸν αἰῶνα). The verse is an example of a reading that
    turns on vowels the consonantal text does not carry.

- id: isa-31-2
  ref: Isaiah 31:2
  kjv: ISA 31:2
  speaker: mediator
  role: claim
  categories: [fulfilment]
  object: his words
  claim: He will bring evil, and will not call back his words.
  mt_lxx: The Hebrew "has not removed (or turned aside) his words" (לֹא הֵסִיר) becomes "his word shall not be set aside" (οὐ μὴ ἀθετηθῇ).

- id: isa-34-16
  ref: Isaiah 34:16
  kjv: ISA 34:16
  speaker: mediator
  role: claim
  categories: [fulfilment, inscripturation]
  object: the book of the LORD
  claim: Seek ye out of the book of the LORD, and read; no one of these shall fail.
  mt_lxx: |
    The Hebrew tells the reader to "seek out of the book of the LORD, and
    read". The Greek has no reference to a book: "They passed by in number,
    and not one of them perished." Only the Hebrew contains the appeal to a
    written book.

- id: isa-40-8
  ref: Isaiah 40:6-8
  kjv: ISA 40:6-8
  speaker: heavenly-voice
  role: claim
  categories: [permanence]
  object: the word of our God
  claim: The grass withereth, the flower fadeth; but the word of our God shall stand for ever.
  mt_lxx: |
    - **Length.** The Greek lacks most of verse 7 ("because the spirit of the
      LORD bloweth upon it: surely the people is grass") and the repetition
      at the start of verse 8. It reads simply: "the grass withered, and the
      flower fell; but the word of our God abides for ever."
    - **Verse 6.** The Hebrew "all its goodliness" (חַסְדּוֹ) is the Greek "all
      the glory of man" (πᾶσα δόξα ἀνθρώπου).
    - **The verb.** The Hebrew "shall stand" (יָקוּם) is the Greek "abides"
      (μένει).
  nt_use: [1PE 1:24-25]
  notes: |
    The voice of 40:6 is unidentified ("the voice said, Cry"), within an oracle
    introduced as God's (40:1). 1 Peter 1:24–25 quotes the Greek, not the
    Hebrew: it has the shorter text, "glory", and "abides". See the
    1 Peter entry for how the Greek New Testament editions differ on this.

- id: isa-45-23
  ref: Isaiah 45:23
  kjv: ISA 45:23
  speaker: god-through-prophet
  role: claim
  categories: [fulfilment]
  object: the word gone out of God's mouth
  claim: I have sworn by myself, the word is gone out of my mouth in righteousness, and shall not return.
  mt_lxx: |
    The Hebrew: "a word in righteousness has gone out of my mouth, and shall
    not return" (וְלֹא יָשׁוּב). The Greek divides it: "righteousness shall go
    out of my mouth; my words shall not be turned back" (οἱ λόγοι μου οὐκ
    ἀποστραφήσονται).
  nt_use: [ROM 14:11, PHP 2:10-11]
  notes: The New Testament quotes the second half (every knee shall bow), not the clause about the word.

- id: isa-46-10
  ref: Isaiah 46:10-11
  kjv: ISA 46:10-11
  speaker: god-through-prophet
  role: claim
  categories: [fulfilment]
  object: my counsel; what I have spoken
  claim: My counsel shall stand; I have spoken it, I will also bring it to pass.
  mt_lxx: The same in substance; the Greek "all my counsel shall stand" (πᾶσα ἡ βουλή μου στήσεται).

- id: isa-55-11
  ref: Isaiah 55:10-11
  kjv: ISA 55:10-11
  speaker: god-through-prophet
  role: claim
  categories: [fulfilment, efficacy]
  object: my word that goeth forth out of my mouth
  claim: My word shall not return unto me void, but shall accomplish that which I please.
  mt_lxx: |
    The Hebrew "shall not return to me empty" (לֹא־יָשׁוּב אֵלַי רֵיקָם); Brenton's
    Greek has "shall not return (οὐ μὴ ἀποστραφῇ) until all that I willed is
    accomplished", without "empty", and adds "and I will prosper thy ways and
    my commandments".
  notes: A claim about the word's effect in the world, not about its text.

- id: isa-59-21
  ref: Isaiah 59:21
  kjv: ISA 59:21
  speaker: god-through-prophet
  role: claim
  categories: [transmission]
  object: my spirit and my words put in thy mouth
  claim: My words which I have put in thy mouth shall not depart out of thy mouth, nor out of the mouth of thy seed, nor out of the mouth of thy seed's seed, from henceforth and for ever.
  mt_lxx: |
    - The Hebrew verb is plural, "they shall not depart" (לֹא־יָמוּשׁוּ, the
      spirit and the words together); the Greek is singular (οὐ μὴ ἐκλίπῃ).
    - The Greek lacks "nor out of the mouth of thy seed's seed".
    - The Greek attaches "from henceforth and for ever" to "for the Lord has
      said it" (εἶπε γὰρ Κύριος ἀπὸ τοῦ νῦν καὶ εἰς τὸν αἰῶνα).
  nt_use: [ROM 11:26-27]
  notes: |
    The strongest Old Testament promise of preservation in transmission: the
    words are to remain in the mouths of a succession of generations. It is a
    covenant promise to the redeemed of Zion (59:20); Romans 11:27 quotes the
    covenant clause. It speaks of words in mouths, not of a written copy.

# ---------------------------------------------------------------- Jeremiah

- id: jer-1-12
  ref: Jeremiah 1:12
  kjv: JER 1:12
  speaker: god-through-prophet
  role: claim
  categories: [fulfilment]
  object: my word
  claim: I will hasten (watch over) my word to perform it.
  mt_lxx: |
    The Hebrew is a pun: the prophet sees an almond rod (שָׁקֵד) and God says he
    is watching (שֹׁקֵד) over his word. The Greek has "a rod of walnut"
    (καρυΐνην) and "I have watched" (ἐγρήγορα); the pun is lost.

- id: jer-8-8
  ref: Jeremiah 8:8
  kjv: JER 8:8
  speaker: god-through-prophet
  role: warning
  categories: [corruption]
  object: the law of the LORD in the scribes' hands
  claim: The law of the LORD is with us? Lo, the lying pen of the scribes has made it into a lie.
  mt_lxx: |
    The Hebrew: "Surely, behold, the lying pen of the scribes has wrought
    falsely" (לַשֶּׁקֶר עָשָׂה עֵט שֶׁקֶר סֹפְרִים). The Greek: "In vain have the
    scribes used a false pen" (εἰς μάτην ἐγενήθη σχοῖνος ψευδὴς
    γραμματεῦσιν; σχοῖνος is a reed or measuring line). The KJV's "in vain
    made he it; the pen of the scribes is in vain" follows a different
    construal.
  notes: |
    Scripture's own acknowledgement that the written law could be falsified
    by those charged with it. Whether the charge is of altering the text or
    of false teaching from it is disputed. **[context]**

- id: jer-23-28
  ref: Jeremiah 23:28-29, 36
  kjv: JER 23:28-29, JER 23:36
  speaker: god-through-prophet
  role: warning
  categories: [corruption, efficacy]
  object: my word
  claim: He that hath my word, let him speak my word faithfully; is not my word like as a fire? Ye have perverted the words of the living God.
  mt_lxx: |
    - In 23:28 the Greek adds "so are my words" after "what is the chaff to
      the wheat?"
    - In 23:36 the Greek lacks the last clause, "for ye have perverted
      (וַהֲפַכְתֶּם) the words of the living God, of the LORD of hosts our God".
      **[context]** The Greek Jeremiah is roughly one-seventh shorter than the
      Hebrew and arranges the book differently; Hebrew fragments from
      Qumran (4QJer^b,d) agree with the shorter form.

- id: jer-26-2
  ref: Jeremiah 26:2
  kjv: JER 26:2
  lxx: JER 33:2
  speaker: god-through-prophet
  role: command
  categories: [no-alteration]
  object: all the words I command thee
  claim: Speak all the words that I command thee; diminish not a word.
  mt_lxx: The same ("diminish not a word", אַל־תִּגְרַע דָּבָר / μὴ ἀφέλῃς ῥῆμα). The chapter is 33 in the Greek.

- id: jer-30-2
  ref: Jeremiah 30:2
  kjv: JER 30:2
  lxx: JER 37:2
  speaker: god-through-prophet
  role: means
  categories: [inscripturation]
  object: all the words I have spoken
  claim: Write thee all the words that I have spoken unto thee in a book.
  mt_lxx: The same. The chapter is 37 in the Greek.

- id: jer-32-14
  ref: Jeremiah 32:10-14
  kjv: JER 32:10-14
  lxx: JER 39:10-14
  speaker: god-through-prophet
  role: means
  categories: [custody]
  object: the sealed and open deeds of purchase
  claim: '"Take these evidences … and put them in an earthen vessel, that they may continue many days."'
  mt_lxx: |
    In 32:14 the Greek reads "the book that was read" (τὸ ἀνεγνωσμένον) for
    "the open one", and "that it may last many days" is ἵνα διαμείνῃ ἡμέρας
    πλείους. 32:11 is shorter in the Greek.
  notes: |
    **[inferred]** A command, given as a prophetic sign, to preserve written
    documents for a long time by storing them in a sealed jar. The object is
    a deed of sale, not a prophecy, but it shows the means of keeping writing
    that God commands.

- id: jer-36
  ref: Jeremiah 36:2, 27-28, 32
  kjv: JER 36:2, JER 36:27-28, JER 36:32
  lxx: JER 43:2, JER 43:27-28, JER 43:32
  speaker: god-through-prophet
  role: means
  categories: [inscripturation, restoration]
  object: the scroll Jehoiakim burned
  claim: After the king burns the scroll, God commands that all the former words be written again; and "there were added besides unto them many like words."
  mt_lxx: |
    The chapter is 43 in the Greek. In 36:32 the Hebrew has Jeremiah take
    another scroll and give it to Baruch; the Greek has Baruch take it.
    Both end with the words added.
  notes: |
    The second narrative of a destroyed text restored. Here the restoration
    is by dictation through the prophet, and the restored book is longer than
    the first.

- id: jer-44-28
  ref: Jeremiah 44:28-29
  kjv: JER 44:28-29
  lxx: JER 51:28-29
  speaker: god-through-prophet
  role: claim
  categories: [fulfilment]
  object: my words
  claim: |
    "All the remnant of Judah … shall know whose words shall stand, mine, or
    theirs"; "my words shall surely stand against you for evil."
  mt_lxx: |
    The Greek (51:28-29) is shorter: "they shall know whose word shall abide
    (λόγος τίνος ἐμμενεῖ)", without "mine, or theirs"; and it lacks "that ye
    may know that my words shall surely stand against you for evil" in 44:29.
  notes: God's words and men's words set against each other; God's "stand" (יָקוּם), the verb of Isaiah 40:8.

- id: jer-51-60
  ref: Jeremiah 51:60-64
  kjv: JER 51:60-64
  lxx: JER 28:60-64
  speaker: narrator
  role: means
  categories: [inscripturation]
  object: a book of the evil to come upon Babylon
  claim: |
    Jeremiah wrote in a book all the evil that should come upon Babylon;
    Seraiah was to read it, bind a stone to it, and cast it into the
    Euphrates.
  mt_lxx: The Greek (28:60-64) lacks the closing "Thus far are the words of Jeremiah" (51:64).
  notes: |
    A written prophecy deliberately destroyed as a sign, the reverse of
    Jeremiah 36. **[inferred]** The words written there are also in the
    book (Jeremiah 50-51), so the destruction of one copy did not remove
    them.

- id: lam-2-17
  ref: Lamentations 2:17
  kjv: LAM 2:17
  speaker: other
  role: claim
  categories: [fulfilment]
  object: his word commanded in the days of old
  claim: |
    The LORD hath done that which he had devised; he hath fulfilled his word
    that he had commanded in the days of old.
  mt_lxx: The Greek has "he has completed his word" (συνετέλεσε ῥῆμα αὐτοῦ) and keeps the acrostic letter name (ΦΗ).
  notes: Spoken by the poet of Lamentations over the fallen city. The fulfilment is of a threat, not a promise.

# ---------------------------------------------------------------- Ezekiel, Daniel, the Twelve

- id: ezek-2-9
  ref: Ezekiel 2:9-3:3
  kjv: EZE 2:9-10, EZE 3:1-3
  speaker: god-through-prophet
  role: means
  categories: [inscripturation, origin]
  object: the roll of a book
  claim: |
    A roll of a book, written within and without, is given to the prophet, who
    eats it; "it was in my mouth as honey for sweetness."
  mt_lxx: The same in substance; the roll is κεφαλὶς βιβλίου.
  nt_use: [REV 10:8-11]
  notes: |
    The prophet's message is given to him already written. Compare Jeremiah
    15:16, "thy words were found, and I did eat them".

- id: ezek-12-25
  ref: Ezekiel 12:25, 28
  kjv: EZE 12:25, EZE 12:28
  speaker: god-through-prophet
  role: claim
  categories: [fulfilment]
  object: the word that I shall speak
  claim: I will speak, and the word that I shall speak shall come to pass; it shall be no more prolonged.
  mt_lxx: Substantially the same.

- id: dan-9-2
  ref: Daniel 9:2, 12
  kjv: DAN 9:2, DAN 9:12
  lxx: DNG 9:2, DNG 9:12
  speaker: other
  role: means
  categories: [transmission, fulfilment]
  object: the word of the LORD to Jeremiah, in the books
  claim: |
    Daniel "understood by books" the seventy years "whereof the word of the
    LORD came to Jeremiah"; "he hath confirmed his words, which he spake
    against us".
  mt_lxx: |
    The same in the Greek (Theodotion): "I understood in the books" (ἐν ταῖς
    βίβλοις) and "he hath confirmed his words" (ἔστησε τοὺς λόγους αὐτοῦ).
  notes: |
    Jeremiah's written prophecy (Jeremiah 25:11-12; 29:10), read in exile a
    generation later and understood as still in force. **[inferred]** The
    clearest Old Testament instance of a prophet's written words being read
    by a later one "in the books" (בַּסְּפָרִים).

- id: dan-12-4
  ref: Daniel 12:4, 9
  kjv: DAN 12:4, DAN 12:9
  lxx: DNG 12:4, DNG 12:9
  speaker: heavenly-voice
  role: means
  categories: [custody]
  object: the words of the book
  claim: Shut up the words, and seal the book, even to the time of the end.
  mt_lxx: Substantially the same. Brenton's Greek Daniel is Theodotion's version, not the Old Greek.

- id: hos-8-12
  ref: Hosea 8:12
  kjv: HOS 8:12
  speaker: god-through-prophet
  role: warning
  categories: [inscripturation, corruption]
  object: the great things of my law
  claim: I have written to him the great things of my law, but they were counted as a strange thing.
  mt_lxx: |
    The Hebrew is past or habitual, "I write (אֶכְתָּב) for him the ten
    thousands (רִבּוֹ, written רבו) of my law". The Greek is future and
    reads the line differently: "I will write down for him a multitude, and
    his ordinances were counted strange".
  notes: |
    God himself is said to write his law, and Israel to treat it as foreign.
    Westminster Larger Catechism Q. 4 cites the verse for the "majesty" of
    Scripture.

- id: amos-8-11
  ref: Amos 8:11-12
  kjv: AMO 8:11-12
  speaker: god-through-prophet
  role: warning
  categories: [withdrawal]
  object: the words of the LORD
  claim: I will send a famine of hearing the words of the LORD; they shall seek the word of the LORD, and shall not find it.
  mt_lxx: |
    The Hebrew has "the words (plural) of the LORD" in 8:11; the Greek has
    the singular. In 8:12 the Hebrew "they shall wander from sea to sea" is
    the Greek "the waters shall be shaken from sea to sea" (σαλευθήσονται
    ὕδατα).
  notes: A threat that the word may be withheld from a people for a time. It speaks of hearing, not of the existence of a text.

- id: hab-2-2
  ref: Habakkuk 2:2-3
  kjv: HAB 2:2-3
  speaker: god
  role: means
  categories: [inscripturation, fulfilment]
  object: the vision
  claim: Write the vision, and make it plain upon tables; it shall surely come, it will not tarry.
  mt_lxx: |
    The Hebrew "it shall not lie" (וְלֹא יְכַזֵּב) is the Greek "and not in vain"
    (οὐκ εἰς κενόν). The Hebrew "it will surely come" refers to the vision;
    the Greek "the coming one will come" (ἐρχόμενος ἥξει) can be read of a
    person, which is how Hebrews 10:37 uses it.
  nt_use: [HEB 10:37-38, ROM 1:17]

- id: zech-1-5
  ref: Zechariah 1:5-6
  kjv: ZEC 1:5-6
  speaker: god-through-prophet
  role: claim
  categories: [fulfilment, permanence]
  object: my words and my statutes
  claim: Your fathers, where are they? and the prophets, do they live for ever? But my words and my statutes, did they not take hold of your fathers?
  mt_lxx: |
    The Hebrew asks a question: "did they not overtake (הִשִּׂיגוּ) your
    fathers?" The Greek gives a command: "But receive ye (δέχεσθε) my words
    and my ordinances, all that I command by my Spirit to my servants the
    prophets", adding "by my Spirit".
  notes: The prophets die; the words outlast them. The claim is about the words' fulfilment on a later generation.

- id: mal-2-7
  ref: Malachi 2:7-8
  kjv: MAL 2:7-8
  speaker: god-through-prophet
  role: warning
  categories: [custody, corruption]
  object: knowledge and the law in the priest's mouth
  claim: |
    "The priest's lips should keep knowledge, and they should seek the law at
    his mouth"; "but ye … have caused many to stumble at the law; ye have
    corrupted the covenant of Levi."
  mt_lxx: The same; "keep knowledge" is φυλάξεται γνῶσιν.
  notes: |
    The priests are the appointed keepers of the law (as in Deuteronomy 31:9),
    and here they are charged with corrupting the covenant through their
    teaching.

- id: mal-4-4
  ref: Malachi 4:4
  kjv: MAL 4:4
  mt: MAL 3:22
  lxx: MAL 3:24
  speaker: god-through-prophet
  role: command
  categories: [transmission]
  object: the law of Moses
  claim: Remember ye the law of Moses my servant, which I commanded unto him in Horeb.
  mt_lxx: |
    The Hebrew numbers the verse 3:22 and places it before the promise of
    Elijah; the Greek (Brenton's 3:24) places it last, after the promise of
    Elijah, so that the Greek Old Testament's prophetic books close with
    "Remember the law of Moses".
  notes: The last command in the Hebrew order of the Twelve.

# ---------------------------------------------------------------- Jesus

- id: matt-5-18
  ref: Matthew 5:17-19
  kjv: MAT 5:17-19
  speaker: jesus
  role: claim
  categories: [inviolability, fulfilment]
  object: the law (and the prophets, v. 17)
  claim: Until heaven and earth pass away, one iota or one horn shall by no means pass away from the law, until all things take place (ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου).
  variants: The three Greek editions agree.
  notes: |
    - ἰῶτα is the Greek letter iota, the smallest letter of the Greek
      alphabet; κεραία, "horn", is the least stroke of a letter, and in Greek
      usage the least stroke of a written law. "One iota or one horn" means
      not the least letter or stroke. The text presents the Law as a text
      that has iotas, a Law in Greek letters. The Evangelist writes Hebrew
      words in Greek letters when he means them (ἀμήν in this verse, Ῥακά in
      5:22), and could have written ἰώδ; he wrote ἰῶτα. This study takes the
      Greek as the text and does not reconstruct a saying behind it. The
      letter therefore counts for the Greek, not the Hebrew.
    - The verb is the one used in the same sentence of heaven and earth:
      παρέλθῃ, "pass away", cease to stand. Luke's parallel has πεσεῖν,
      "fall", the idiom for a word that loses its force (Luke 16:17).
    - Verse 19 draws the consequence with "therefore" (οὖν): whoever
      "loosens" (λύσῃ) one of the least commandments. What does not pass
      away is the binding force of every part of the law, down to its least
      commandment. The saying is not about the copying of a text in any
      language. **[inferred]**, following
      [preservation-hebrew-and-greek.md §1.1](../../analysis/preservation-hebrew-and-greek.md#11-matthew-518-read-in-the-greek).
    - It has two time limits: "until heaven and earth pass away" and "until
      all things take place" (ἕως ἂν πάντα γένηται). Matthew 24:35 sets
      Jesus's own words beyond the first limit.
    - The Westminster Confession (1.8) and the Savoy Declaration (1.8) cite
      it as the sole proof for "kept pure in all ages"; see
      [confessions.md](../../analysis/preservation-of-scripture/confessions.md#westminster-confession-18-kept-pure-in-all-ages).

- id: matt-22-31
  ref: Matthew 22:31-32; Mark 12:26
  kjv: MAT 22:31-32, MAR 12:26
  speaker: jesus
  role: claim
  categories: [transmission, origin]
  object: that which was spoken unto you by God
  claim: '"Have ye not read that which was spoken unto you by God, saying, I am the God of Abraham …?"'
  variants: Minor. In Mark 12:26 SBL and the Byzantine text read "how" (πῶς) for "as" (ὡς).
  notes: |
    Jesus treats words written in Exodus 3:6 as spoken by God "to you" (ὑμῖν),
    the hearers generations later. **[inferred]** The written word is God's
    address to every later generation that reads it. The argument also rests
    on the tense of the quotation ("I am", ἐγώ εἰμι).

- id: matt-26-54
  ref: Matthew 26:54, 56; Mark 14:49; Luke 18:31; 21:22; 22:37; 24:25-27
  kjv: MAT 26:54, MAT 26:56, MAR 14:49, LUK 18:31, LUK 21:22, LUK 22:37, LUK 24:25-27
  speaker: jesus
  role: claim
  categories: [fulfilment]
  object: the scriptures; all things that are written
  claim: |
    "How then shall the scriptures be fulfilled, that thus it must be?"; "all
    things that are written by the prophets concerning the Son of man shall be
    accomplished"; "this that is written must yet be accomplished in me".
  variants: |
    In Luke 21:22 SBL reads πλησθῆναι for πληρωθῆναι ("be fulfilled"); in Luke
    18:31 the Byzantine text reads τελειωθήσεται for τελεσθήσεται ("shall be
    accomplished"); in Luke 22:37 SBL lacks "yet" (ἔτι). The sense is the
    same.
  notes: |
    Jesus speaks of the fulfilment of Scripture as necessary (δεῖ, "it must").
    The many single fulfilment notices of the Gospels ("that it might be
    fulfilled which was spoken …") are not listed one by one; these are
    the passages in which Jesus states the general principle. Luke 24:44 is
    a separate entry.

- id: matt-26-13
  ref: Matthew 26:13; Mark 14:9
  kjv: MAT 26:13, MAR 14:9
  speaker: jesus
  role: claim
  categories: [transmission]
  object: what this woman has done, told with the gospel
  claim: |
    Wheresoever this gospel shall be preached in the whole world, there shall
    also this, that this woman hath done, be told for a memorial of her.
  variants: SBL reads "the gospel" for "this gospel" in Mark 14:9.
  notes: |
    A promise that a particular account will be carried with the gospel
    throughout the world. **[inferred]** The Gospels' own record of it is
    the means by which the promise is kept.

- id: matt-28-20
  ref: Matthew 28:19-20
  kjv: MAT 28:19-20
  speaker: jesus
  role: command
  categories: [transmission]
  object: all things whatsoever I have commanded you
  claim: |
    Teaching them to observe all things whatsoever I have commanded you; and,
    lo, I am with you alway, even unto the end of the world.
  variants: The Byzantine text lacks "therefore" (οὖν) in 28:19; SBL lacks the closing "Amen".
  notes: |
    The command to pass on all Jesus's commands is joined to the promise of
    his presence "unto the end of the age" (ἕως τῆς συντελείας τοῦ αἰῶνος).
    Westminster Confession 25.3 cites it with Isaiah 59:21.

- id: luke-16-17
  ref: Luke 16:17
  kjv: LUK 16:17
  speaker: jesus
  role: claim
  categories: [inviolability]
  object: the law
  claim: It is easier for heaven and earth to pass away than for one horn of the law to fall (μίαν κεραίαν πεσεῖν).
  variants: The three Greek editions agree.
  notes: |
    "To fail" is πεσεῖν, "to fall", the Old Testament idiom for an unfulfilled
    word (Joshua 21:45; 23:14; 1 Samuel 3:19; 2 Kings 10:10). The next verse
    (16:18) applies the law on divorce more strictly, not less.

- id: luke-16-29
  ref: Luke 16:29, 31
  kjv: LUK 16:29, LUK 16:31
  speaker: jesus
  role: claim
  categories: [transmission]
  object: Moses and the prophets
  claim: |
    "They have Moses and the prophets; let them hear them." "If they hear not
    Moses and the prophets, neither will they be persuaded, though one rose
    from the dead."
  variants: The editions agree in substance.
  notes: |
    Spoken by Abraham in Jesus's parable. The written Moses and prophets are
    present to the rich man's brothers, and are said to be enough.

- id: matt-24-35
  ref: Matthew 24:35; Mark 13:31; Luke 21:33
  kjv: MAT 24:35, MAR 13:31, LUK 21:33
  speaker: jesus
  role: claim
  categories: [permanence]
  object: my words
  claim: Heaven and earth shall pass away, but my words shall not pass away.
  variants: |
    The Textus Receptus and the Byzantine text have "shall not pass away"
    as an emphatic subjunctive (οὐ μὴ παρέλθωσι) in all three Gospels. The
    SBL text has the subjunctive in Matthew but the future indicative in Mark
    and Luke (οὐ μὴ παρελεύσονται), and the singular "heaven and earth shall
    pass" (παρελεύσεται) in Matthew. The sense is the same.
  notes: |
    Jesus's own words, not the law, are the object, and they are set beyond
    the life of the created order. The strongest permanence claim in the
    collection. **[inferred]** It is a claim about what Jesus said, not about
    the copies or translations in which it is transmitted.

- id: john-10-35
  ref: John 10:35; 7:23
  kjv: JOH 10:35, JOH 7:23
  speaker: jesus
  role: claim
  categories: [inviolability]
  object: the scripture
  claim: The scripture cannot be loosed (οὐ δύναται λυθῆναι ἡ γραφή), that is, annulled.
  variants: The editions agree.
  notes: |
    "Broken" is λυθῆναι, "loosed, annulled", the verb of Matthew 5:19. Spoken
    of a single phrase of Psalm 82:6 ("I said, Ye are gods"), which Jesus
    treats as binding because it is written. In John 7:23 the same verb is
    used of the law of Moses ("that the law of Moses should not be broken",
    ἵνα μὴ λυθῇ ὁ νόμος Μωσέως).

- id: john-5-39
  ref: John 5:39, 45-47
  kjv: JOH 5:39, JOH 5:45-47
  speaker: jesus
  role: claim
  categories: [inscripturation, origin]
  object: the scriptures; Moses's writings
  claim: |
    "Search the scriptures … they are they which testify of me"; "if ye
    believe not his writings (γράμμασιν), how shall ye believe my words?"
  variants: The editions agree in substance.
  notes: |
    Moses's writings are set beside Jesus's spoken words; to disbelieve the
    one is to disbelieve the other. Westminster Confession 1.8 cites 5:39 and
    5:46.

- id: john-6-63
  ref: John 6:63, 68
  kjv: JOH 6:63, JOH 6:68
  speaker: jesus
  role: claim
  categories: [efficacy]
  object: the words I speak
  claim: '"The words that I speak unto you, they are spirit, and they are life"; "thou hast the words of eternal life."'
  variants: |
    In 6:63 the Textus Receptus and Byzantine text read "the words that I
    speak" (λαλῶ); SBL "that I have spoken" (λελάληκα).
  notes: Verse 68 is Peter's confession.

- id: john-8-31
  ref: John 8:31, 51; 14:23; 17:6
  kjv: JOH 8:31, JOH 8:51, JOH 14:23, JOH 17:6
  speaker: jesus
  role: claim
  categories: [keeping]
  object: my word
  claim: |
    "If ye continue (μείνητε) in my word, then are ye my disciples indeed";
    "if a man keep (τηρήσῃ) my saying, he shall never see death"; "they have
    kept thy word."
  variants: The editions agree in substance; in 17:6 SBL reads "thou gavest" (ἔδωκας) for "thou hast given" (δέδωκας).
  notes: |
    The word "abides" in the faithful and they "keep" it. **[inferred]** In the
    Greek of both Testaments it is people who keep the word and God who
    keeps people (see greek-consistency.md §8); these passages are the
    clearest statement of the first half.

- id: john-12-48
  ref: John 12:48
  kjv: JOH 12:48
  speaker: jesus
  role: claim
  categories: [permanence]
  object: the word that I have spoken
  claim: The word that I have spoken, the same shall judge him in the last day.
  variants: The editions agree.
  notes: The word Jesus spoke is to be present and in force at the last judgment.

- id: john-14-26
  ref: John 14:26; 16:13
  kjv: JOH 14:26, JOH 16:13
  speaker: jesus
  role: means
  categories: [transmission]
  object: all things that I have said
  claim: The Holy Ghost shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you; he will guide you into all truth.
  variants: In 16:13 the Textus Receptus and the Byzantine text have "into all the truth" (εἰς πᾶσαν τὴν ἀλήθειαν); SBL has "in all the truth" (ἐν τῇ ἀληθείᾳ πάσῃ).
  notes: The means by which Jesus's spoken words were to reach the apostolic record. A promise to the apostles. **[inferred]**

- id: john-17-17
  ref: John 17:17
  kjv: JOH 17:17
  speaker: jesus
  role: claim
  categories: [purity]
  object: thy word
  claim: Thy word is truth.
  variants: The Textus Receptus and Byzantine text have "in thy truth" (ἐν τῇ ἀληθείᾳ σου); SBL has "in the truth".

- id: john-17-8
  ref: John 17:8, 14, 20
  kjv: JOH 17:8, JOH 17:14, JOH 17:20
  speaker: jesus
  role: claim
  categories: [transmission]
  object: the words thou gavest me; their word
  claim: |
    "I have given unto them the words which thou gavest me"; "I pray … for
    them also which shall believe on me through their word."
  variants: |
    In 17:20 the Textus Receptus reads "which shall believe" (πιστευσόντων);
    the Byzantine and SBL texts "which believe" (πιστευόντων).
  notes: |
    The chain of transmission in Jesus's own prayer, from the Father, to
    Jesus, to the apostles, to those who believe "through their word" (διὰ τοῦ
    λόγου αὐτῶν).

- id: john-20-31
  ref: John 20:30-31; 21:24-25
  kjv: JOH 20:30-31, JOH 21:24-25
  speaker: narrator
  role: means
  categories: [inscripturation]
  object: these things written
  claim: |
    "These are written, that ye might believe"; "this is the disciple which
    testifieth of these things, and wrote these things: and we know that his
    testimony is true."
  variants: In 20:31 SBL reads "that ye may go on believing" (πιστεύητε) for "that ye might believe" (πιστεύσητε).
  notes: The Gospel states its own purpose and the truth of its witness, and says that much else was not written.

- id: mark-4-15
  ref: Mark 4:15; Luke 8:12, 15
  kjv: MAR 4:15, LUK 8:12, LUK 8:15
  speaker: jesus
  role: warning
  categories: [withdrawal, keeping]
  object: the word sown in hearts
  claim: |
    "Satan cometh immediately, and taketh away the word that was sown in their
    hearts"; the good ground "having heard the word, keep it (κατέχουσιν)".
  variants: In Mark 4:15 SBL reads "the word sown in them" (εἰς αὐτούς) for "in their hearts".
  notes: The word can be taken away from a hearer by Satan, and is kept by those who hold it fast.

- id: matt-4-4
  ref: Matthew 4:4
  kjv: MAT 4:4
  speaker: jesus
  role: claim
  categories: [efficacy]
  object: every word proceeding out of the mouth of God
  claim: Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.
  variants: SBL adds the article before "man"; minor.
  notes: Quotes Deuteronomy 8:3 in the Greek wording, which supplies "word" where the Hebrew has none.

- id: matt-15-6
  ref: Matthew 15:6; Mark 7:13
  kjv: MAT 15:6, MAR 7:13
  speaker: jesus
  role: warning
  categories: [corruption]
  object: the commandment / word of God
  claim: Ye have made the commandment of God of none effect by your tradition.
  variants: |
    In Matthew 15:6 the Textus Receptus and the Byzantine text read "the
    commandment of God" (τὴν ἐντολὴν); SBL reads "the word of God" (τὸν λόγον).
    Mark 7:13 has "the word" in all three. The verb is ἀκυρόω, "to make void,
    annul".
  notes: The word can be nullified in practice by a tradition that overrides it, while its text remains.

- id: luke-1-37
  ref: Luke 1:37
  kjv: LUK 1:37
  speaker: heavenly-voice
  role: claim
  categories: [fulfilment]
  object: every word (ῥῆμα) from God
  claim: No word from God shall be without power (οὐκ ἀδυνατήσει παρὰ τοῦ θεοῦ πᾶν ῥῆμα).
  variants: TR and Byz read παρὰ τῷ θεῷ, "with God"; SBL reads παρὰ τοῦ θεοῦ, "from God".
  notes: |
    Gabriel's answer to Mary. ῥῆμα can mean "word" or "thing", so the KJV has
    "with God nothing shall be impossible". The phrase echoes the Greek of
    Genesis 18:14, μὴ ἀδυνατήσει παρὰ τῷ θεῷ ῥῆμα; "Is any thing too hard for the
    LORD?". With the reading "from God" (SBL) it is a claim that no word God
    speaks fails of its effect, which Mary's reply takes up: "be it unto me
    according to thy word" (κατὰ τὸ ῥῆμά σου, 1:38). **[inferred]**

- id: luke-1-1
  ref: Luke 1:1-4
  kjv: LUK 1:1-4
  speaker: narrator
  role: means
  categories: [inscripturation, transmission]
  object: the things delivered by eyewitnesses
  claim: |
    Many have taken in hand to set forth the things delivered (παρέδοσαν) by
    eyewitnesses and ministers of the word; it seemed good to write them in
    order, "that thou mightest know the certainty (ἀσφάλειαν) of those
    things".
  variants: The editions agree.
  notes: |
    The evangelist in his own voice. Transmission runs from eyewitnesses, by
    handing down, to an orderly written account, and its purpose is certainty.
    Westminster Confession 1.1 cites the passage.

- id: luke-24-44
  ref: Luke 24:44
  kjv: LUK 24:44
  speaker: jesus
  role: claim
  categories: [fulfilment]
  object: all things written in the law, the prophets and the psalms
  claim: All things must be fulfilled, which were written in the law of Moses, and in the prophets, and in the psalms, concerning me.
  variants: SBL adds "my" ("these are my words").

- id: rev-1-19
  ref: Revelation 1:19
  kjv: REV 1:19
  speaker: jesus
  role: means
  categories: [inscripturation]
  object: what John has seen
  claim: Write the things which thou hast seen.
  variants: SBL and the Byzantine text add "therefore" (οὖν).

- id: rev-1-3
  ref: Revelation 1:3; 22:7, 9
  kjv: REV 1:3, REV 22:7, REV 22:9
  speaker: jesus
  role: claim
  categories: [keeping]
  object: the words of this prophecy, this book
  claim: |
    "Blessed is he that readeth, and they that hear the words of this
    prophecy, and keep those things which are written therein"; "blessed is he
    that keepeth the sayings of the prophecy of this book."
  variants: The editions agree in substance.
  notes: |
    22:7 is Jesus speaking; 1:3 is the book's own opening; 22:9 is the angel.
    The book is to be read aloud and kept.

- id: rev-10-7
  ref: Revelation 10:7; 17:17
  kjv: REV 10:7, REV 17:17
  speaker: heavenly-voice
  role: claim
  categories: [fulfilment]
  object: the mystery of God declared to the prophets; the words of God
  claim: |
    The mystery of God should be finished, "as he hath declared to his
    servants the prophets"; "until the words of God shall be fulfilled".
  variants: |
    In 10:7 the Textus Receptus reads "should be finished" (τελεσθῇ); the
    Byzantine and SBL texts "is finished" (ἐτελέσθη). In 17:17 the Textus
    Receptus reads "until the words (τὰ ῥήματα) of God be fulfilled"; the
    Byzantine text has τελεσθῶσιν οἱ λόγοι and SBL "shall be fulfilled"
    (τελεσθήσονται οἱ λόγοι).
  notes: 10:7 is the angel's oath; 17:17 is the angel's explanation.

- id: rev-14-6
  ref: Revelation 14:6
  kjv: REV 14:6
  speaker: heavenly-voice
  role: claim
  categories: [permanence]
  object: the everlasting gospel
  claim: An angel having the everlasting gospel (εὐαγγέλιον αἰώνιον) to preach unto them that dwell on the earth.
  variants: |
    The Textus Receptus reads "them that dwell (κατοικοῦντας) on the earth";
    the Byzantine and SBL texts "them that sit (καθημένους) on the earth".
  notes: The only place the gospel is called "eternal".

- id: rev-22-18
  ref: Revelation 22:18-19
  kjv: REV 22:18-19
  speaker: jesus
  role: command
  categories: [no-alteration]
  object: the words of the prophecy of this book
  claim: If any man shall add unto these things, God shall add unto him the plagues; if any man shall take away from the words of this book, God shall take away his part.
  variants: |
    - 22:18: the Textus Receptus has "For I testify together" (Συμμαρτυροῦμαι
      γὰρ); the Byzantine and SBL texts have "I testify" (Μαρτυρῶ ἐγὼ).
    - 22:19: the Textus Receptus has "out of the **book** of life" (ἀπὸ
      Βίβλου τῆς ζωῆς); the Byzantine and SBL texts have "from the **tree**
      of life" (ἀπὸ τοῦ ξύλου τῆς ζωῆς). **[context]** Erasmus's only Greek
      manuscript of Revelation lacked the book's last verses, which he
      supplied by translating the Latin Vulgate back into Greek; the Latin
      tradition he used read *libro*. The Textus Receptus reading has little
      or no Greek manuscript support.
  notes: |
    The speaker is the one who "testifieth these things" (22:20), Jesus. A
    curse on altering this book, not a promise that it will not be altered.
    The passage that warns against changing the text is itself one of the
    places where the printed Greek texts differ most.

- id: rev-22-10
  ref: Revelation 22:10
  kjv: REV 22:10
  speaker: heavenly-voice
  role: command
  categories: [custody]
  object: the sayings of the prophecy of this book
  claim: Seal not the sayings of the prophecy of this book, for the time is at hand.
  variants: The editions agree.
  notes: The reverse of Daniel 12:4 ("seal the book, even to the time of the end").

# ---------------------------------------------------------------- Apostles

- id: 1pet-1-23
  ref: 1 Peter 1:23-25
  kjv: 1PE 1:23-25
  speaker: apostle
  role: claim
  categories: [permanence]
  object: the word of God; the word preached to you
  claim: Born again by the word of God, which liveth and abideth for ever; the word of the Lord endureth for ever, and this is the word which by the gospel is preached unto you.
  variants: |
    - 1:23: the Textus Receptus and Byzantine text end "which liveth and
      abideth **for ever**" (μένοντος εἰς τὸν αἰῶνα); SBL omits "for ever".
    - 1:24: the Textus Receptus and Byzantine text read "all the glory **of
      man**" (ἀνθρώπου), agreeing with the Greek of Isaiah; SBL reads "all
      **its** glory" (αὐτῆς), which corresponds to the Hebrew suffix (חַסְדּוֹ,
      "its goodliness").
    - 1:25: all three read "the word **of the Lord**" (ῥῆμα κυρίου), where the
      Greek of Isaiah has "the word **of our God**" (τοῦ θεοῦ ἡμῶν).
  notes: |
    - Peter quotes Isaiah 40 in the Greek's shorter form and with its verb
      "abides" (μένει).
    - The Greek of 1:23 can be read "the word of the living and abiding God"
      (taking both participles with θεοῦ, as the Vulgate does) or "the living
      and abiding word of God".
    - Peter applies the endurance to "the word which by the gospel is preached
      unto you", the proclamation, without distinguishing it from a text.

- id: 1pet-2-2
  ref: 1 Peter 2:2
  kjv: 1PE 2:2
  speaker: apostle
  role: claim
  categories: [purity]
  object: the milk of the word
  claim: As newborn babes, desire the sincere milk of the word.
  variants: SBL adds "unto salvation" (εἰς σωτηρίαν) at the end of the verse.
  notes: |
    "Sincere" is ἄδολος, "unadulterated", the negative of the verb Paul uses
    for "handling deceitfully" (δολοῦντες) in 2 Corinthians 4:2. It follows
    directly on 1:23–25. "Of the word" is λογικόν, which can also mean
    "spiritual" or "rational". The New Testament's one description of God's
    word as free of adulteration is applied to what believers are to desire,
    not to a text's transmission. **[inferred]**

- id: 1pet-1-10
  ref: 1 Peter 1:10-12
  kjv: 1PE 1:10-12
  speaker: apostle
  role: claim
  categories: [transmission, origin]
  object: what the prophets foretold
  claim: |
    The prophets searched what the Spirit of Christ in them did signify; "unto
    them it was revealed, that not unto themselves, but unto us they did
    minister".
  variants: In 1:12 the Textus Receptus reads "unto us" (ἡμῖν); the Byzantine and SBL texts "unto you" (ὑμῖν).
  notes: The prophets wrote for a later generation, the New Testament form of Psalm 102:18 and Romans 15:4.

- id: rom-3-2
  ref: Romans 3:2
  kjv: ROM 3:2
  speaker: apostle
  role: means
  categories: [custody]
  object: the oracles of God
  claim: Unto them [the Jews] were committed the oracles of God.
  variants: The editions agree.
  notes: |
    The Jews were "entrusted" (ἐπιστεύθησαν) with the oracles (τὰ λόγια).
    The Second London Confession cites this verse in its proofs for 1.8.
    Paul's next verse asks whether their unbelief makes God's faithfulness
    void, and answers no.

- id: rom-1-2
  ref: Romans 1:2
  kjv: ROM 1:2
  speaker: apostle
  role: claim
  categories: [inscripturation, fulfilment]
  object: the gospel promised in the holy scriptures
  claim: The gospel "he had promised afore by his prophets in the holy scriptures" (ἐν γραφαῖς ἁγίαις).
  variants: The editions agree.
  notes: |
    The first reference to Scripture in the letter. The closing doxology adds
    that the mystery is now "by the scriptures of the prophets … made known to
    all nations" (16:26 in the Textus Receptus; the Byzantine edition prints
    the doxology at 14:24-26 and the SBL file used here does not include it).

- id: rom-9-6
  ref: Romans 9:6
  kjv: ROM 9:6
  speaker: apostle
  role: claim
  categories: [fulfilment]
  object: the word of God
  claim: Not as though the word of God hath taken none effect.
  variants: The editions agree.
  notes: |
    "Taken none effect" is ἐκπέπτωκεν, "has fallen", the verb the Greek of
    Isaiah 40:7 and 1 Peter 1:24 use for the flower that "fell".

- id: rom-10-8
  ref: Romans 10:8, 17
  kjv: ROM 10:8, ROM 10:17
  speaker: apostle
  role: claim
  categories: [transmission, efficacy]
  object: the word of faith which we preach
  claim: |
    "The word is nigh thee, even in thy mouth … that is, the word of faith,
    which we preach"; "faith cometh by hearing, and hearing by the word of
    God."
  variants: |
    In 10:17 the Textus Receptus and Byzantine text read "the word of God"
    (ῥήματος Θεοῦ); SBL "the word of Christ" (ῥήματος Χριστοῦ).
  notes: Paul applies Deuteronomy 30:14 to the word preached by the apostles.

- id: rom-15-4
  ref: Romans 4:23-24; 15:4; 1 Corinthians 9:10; 10:11
  kjv: ROM 4:23-24, ROM 15:4, 1CO 9:10, 1CO 10:11
  speaker: apostle
  role: claim
  categories: [transmission]
  object: whatsoever things were written aforetime
  claim: Whatsoever things were written aforetime were written for our learning; they are written for our admonition, upon whom the ends of the world are come.
  variants: In Romans 15:4 SBL has "were written" (ἐγράφη) for the second "were written aforetime" (προεγράφη). In 1 Corinthians 9:10 SBL orders the words differently.
  notes: Romans 4:23-24 ("it was not written for his sake alone … but for us also") and 1 Corinthians 9:10 ("for our sakes, no doubt, this is written") say the same of single passages. The Old Testament writings were written for a later generation, which presupposes they would reach it.

- id: 2tim-3-16
  ref: 2 Timothy 3:15-16
  kjv: 2TI 3:15-16
  speaker: apostle
  role: claim
  categories: [origin]
  object: all scripture; the holy scriptures Timothy knew from a child
  claim: All scripture is given by inspiration of God (θεόπνευστος), and is profitable.
  variants: SBL omits the article before "holy writings" (ἱερὰ γράμματα) and reads ἐλεγμόν for ἔλεγχον ("reproof").
  notes: |
    A claim about the origin and use of Scripture, not its preservation. It
    is included because it is cited everywhere alongside the preservation
    texts. **[inferred]** The "holy writings" Timothy knew from a child were
    copies, not autographs, and the verse calls them able to make him wise
    unto salvation.

- id: 2pet-1-19
  ref: 2 Peter 1:19-21
  kjv: 2PE 1:19-21
  speaker: apostle
  role: claim
  categories: [origin]
  object: the prophetic word
  claim: We have a more sure word of prophecy; prophecy came not by the will of man, but holy men of God spake as they were moved by the Holy Ghost.
  variants: In 1:21 the Textus Receptus has "holy men of God" (οἱ ἅγιοι Θεοῦ ἄνθρωποι); SBL has "men spoke from God" (ἀπὸ θεοῦ ἄνθρωποι).

- id: 2pet-1-12
  ref: 2 Peter 1:12-15; 3:1-2
  kjv: 2PE 1:12-15, 2PE 3:1-2
  speaker: apostle
  role: means
  categories: [transmission, inscripturation]
  object: these things; the words of the prophets and the commandment of the apostles
  claim: |
    "I will endeavour that ye may be able after my decease to have these
    things always in remembrance"; "this second epistle … I write unto you …
    that ye may be mindful of the words which were spoken before by the holy
    prophets, and of the commandment of us the apostles."
  variants: |
    In 1:12 the Textus Receptus and Byzantine text read "I will not be
    negligent to put you always in remembrance" (οὐκ ἀμελήσω); SBL "I will
    always be ready" (μελλήσω ἀεί).
  notes: |
    An apostle makes provision, by writing, for his teaching to be remembered
    after his death, and sets the apostles' commandment beside the prophets'
    words.

- id: 2tim-2-9
  ref: 2 Timothy 2:9
  kjv: 2TI 2:9
  speaker: apostle
  role: claim
  categories: [efficacy]
  object: the word of God
  claim: The word of God is not bound.
  variants: The editions agree.

- id: 2thess-2-2
  ref: 2 Thessalonians 2:2, 15; 3:17
  kjv: 2TH 2:2, 2TH 2:15, 2TH 3:17
  speaker: apostle
  role: warning
  categories: [corruption, custody, keeping]
  object: letters "as from us"; the traditions taught by word or epistle
  claim: |
    Be not shaken "by letter as from us"; "hold the traditions which ye have
    been taught, whether by word, or our epistle"; "the salutation of Paul
    with mine own hand, which is the token in every epistle, so I write."
  variants: |
    In 2:2 the Textus Receptus and Byzantine text read "the day of Christ"
    (Χριστοῦ); SBL "the day of the Lord" (κυρίου).
  notes: |
    The only New Testament warning against a forged apostolic letter, with
    the means Paul gives for telling a genuine one (his own hand). The
    genuine teaching, spoken or written, is to be held fast (κρατεῖτε).

- id: 1tim-6-20
  ref: 1 Timothy 6:20; 2 Timothy 1:13-14
  kjv: 1TI 6:20, 2TI 1:13-14
  speaker: apostle
  role: command
  categories: [keeping, custody]
  object: the deposit (παραθήκη); the pattern of sound words
  claim: |
    "Keep that which is committed to thy trust (τὴν παραθήκην φύλαξον)"; "hold
    fast the form of sound words"; "that good thing which was committed unto
    thee keep by the Holy Ghost which dwelleth in us."
  variants: |
    The Textus Receptus reads παρακαταθήκην, "deposit", in both places; SBL
    reads παραθήκην in both; the Byzantine text has παρακαταθήκην in 1 Timothy
    6:20 and παραθήκην in 2 Timothy 1:14. The words mean the same.
  notes: |
    παραθήκη is a deposit entrusted for safekeeping. It is kept by Timothy
    and "through the Holy Spirit" (διὰ πνεύματος ἁγίου). Here, unusually,
    φυλάσσω has a teaching as its object, but the keeper is a person. Two
    verses earlier God is the keeper: "he is able to keep that which I have
    committed unto him" (τὴν παραθήκην μου φυλάξαι, 2 Timothy 1:12).
    What Paul has entrusted to God there is not said to be a teaching or a
    text; **[context]** it is usually read of his life or salvation.

- id: 2tim-2-2
  ref: 2 Timothy 2:2
  kjv: 2TI 2:2
  speaker: apostle
  role: command
  categories: [transmission]
  object: the things heard from Paul
  claim: |
    The things that thou hast heard of me among many witnesses, the same
    commit thou to faithful men, who shall be able to teach others also.
  variants: The editions agree.
  notes: |
    Four links of transmission in one sentence (Paul, Timothy, faithful men,
    others), with "commit" (παράθου) from the root of παραθήκη.

- id: 2tim-4-13
  ref: 2 Timothy 4:13
  kjv: 2TI 4:13
  speaker: apostle
  role: means
  categories: [custody]
  object: the books and the parchments
  claim: Bring with thee the cloke … and the books, but especially the parchments.
  variants: The editions agree in substance.
  notes: |
    **[inferred]** The only mention of an apostle's own books (βιβλία) and
    parchments (μεμβράνας). What they contained is not said.

- id: titus-1-9
  ref: Titus 1:9; Colossians 3:16; 1 Corinthians 11:2
  kjv: TIT 1:9, COL 3:16, 1CO 11:2
  speaker: apostle
  role: command
  categories: [keeping]
  object: the faithful word; the word of Christ; the ordinances delivered
  claim: |
    "Holding fast the faithful word as he hath been taught"; "let the word of
    Christ dwell in you richly"; "keep the ordinances, as I delivered them to
    you."
  variants: In Colossians 3:16 SBL reads "singing to God" (θεῷ) for "to the Lord".
  notes: |
    The church keeps the word by holding it fast, letting it dwell, and
    keeping what was delivered. Westminster Confession 1.8 cites Colossians
    3:16.

- id: heb-4-12
  ref: Hebrews 4:12
  kjv: HEB 4:12
  speaker: apostle
  role: claim
  categories: [efficacy]
  object: the word of God
  claim: The word of God is quick, and powerful.
  variants: SBL reads "soul and spirit" (καὶ) for "both soul and spirit" (τε καὶ).

- id: heb-1-1
  ref: Hebrews 1:1-2
  kjv: HEB 1:1-2
  speaker: apostle
  role: claim
  categories: [origin]
  object: God's speaking by the prophets and by his Son
  claim: |
    God, who at sundry times and in divers manners spake in time past unto the
    fathers by the prophets, hath in these last days spoken unto us by his
    Son.
  variants: |
    The Textus Receptus reads "in these last days" (ἐσχάτων); the Byzantine
    and SBL texts "at the end of these days" (ἐσχάτου).
  notes: |
    The opening of Westminster Confession 1.1 echoes it ("at sundry times, and
    in divers manners"). Hebrews names no author; the speaker tag is the
    closest available.

- id: heb-2-2
  ref: Hebrews 2:1-4
  kjv: HEB 2:1-4
  speaker: apostle
  role: warning
  categories: [inviolability, transmission]
  object: the word spoken by angels; the salvation spoken by the Lord
  claim: |
    Lest "we should let them slip"; "the word spoken by angels was stedfast
    (βέβαιος)"; the great salvation "was confirmed (ἐβεβαιώθη) unto us by them
    that heard him".
  variants: The editions agree.
  notes: |
    The law was "firm"; the gospel, spoken by the Lord, was "confirmed" to a
    later generation by those who heard him, God bearing witness with signs.

- id: 1thess-2-13
  ref: 1 Thessalonians 2:13
  kjv: 1TH 2:13
  speaker: apostle
  role: claim
  categories: [efficacy]
  object: the word of God heard from the apostles
  claim: Ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh in you.

- id: 1cor-15-1
  ref: 1 Corinthians 15:1-4
  kjv: 1CO 15:1-4
  speaker: apostle
  role: means
  categories: [transmission, keeping]
  object: the gospel which I preached unto you
  claim: |
    "If ye keep in memory (κατέχετε) what I preached unto you"; "I delivered
    (παρέδωκα) unto you first of all that which I also received … according to
    the scriptures."
  variants: The editions agree.
  notes: |
    The language of handing on what was received (παραλαμβάνω / παραδίδωμι).
    The gospel is kept by being held fast.

- id: 1cor-14-37
  ref: 1 Corinthians 14:37
  kjv: 1CO 14:37
  speaker: apostle
  role: claim
  categories: [origin]
  object: the things that I write
  claim: Let him acknowledge that the things that I write unto you are the commandments of the Lord.
  variants: |
    The Textus Receptus and Byzantine text read "are the commandments of the
    Lord" (τοῦ Κυρίου εἰσὶν ἐντολαί); SBL reads "is of the Lord" (κυρίου
    ἐστίν), without "commandment".
  notes: An apostle's claim that what he writes is the Lord's command.

- id: 1cor-5-9
  ref: 1 Corinthians 5:9; Colossians 4:16
  kjv: 1CO 5:9, COL 4:16
  speaker: apostle
  role: means
  categories: [loss, transmission]
  object: an earlier letter to Corinth; the letter from Laodicea
  claim: |
    "I wrote unto you in an epistle not to company with fornicators"; "when
    this epistle is read among you, cause that it be read also in the church
    of the Laodiceans; and that ye likewise read the epistle from Laodicea."
  variants: The editions agree.
  notes: |
    **[context]** 1 Corinthians 5:9 is generally taken to refer to a letter of
    Paul's to Corinth earlier than 1 Corinthians, and Colossians 4:16 to a
    letter to Laodicea; neither is extant under that name (some identify
    the second with Ephesians). Colossians 4:16 also shows apostolic letters
    being exchanged and read between churches, the first means of their
    circulation.

- id: 2cor-1-20
  ref: 2 Corinthians 1:20
  kjv: 2CO 1:20
  speaker: apostle
  role: claim
  categories: [fulfilment]
  object: all the promises of God
  claim: For all the promises of God in him are yea, and in him Amen.
  variants: SBL reads "wherefore also through him is the Amen" (διὸ καὶ διʼ αὐτοῦ τὸ ἀμήν) for "and in him Amen".
  notes: Every promise of God finds its "yes" in Christ.

- id: acts-7-38
  ref: Acts 7:38
  kjv: ACT 7:38
  speaker: other
  role: claim
  categories: [efficacy, transmission]
  object: the lively oracles given at Sinai
  claim: Moses received the lively oracles (λόγια ζῶντα) to give unto us.
  variants: The Textus Receptus and Byzantine text have "to give unto us" (ἡμῖν); SBL has "unto you" (ὑμῖν).
  notes: Stephen is the speaker, in his speech before the council.

- id: acts-1-16
  ref: Acts 1:16; 3:18, 21
  kjv: ACT 1:16, ACT 3:18, ACT 3:21
  speaker: apostle
  role: claim
  categories: [fulfilment, origin]
  object: the scripture which the Holy Ghost spake by David; the mouth of all his holy prophets
  claim: |
    "This scripture must needs have been fulfilled, which the Holy Ghost by
    the mouth of David spake"; God "spake by the mouth of all his holy
    prophets since the world began".
  variants: SBL lacks "this" (ταύτην) in Acts 1:16 ("the scripture" for "this scripture").
  notes: |
    Peter's speeches. The written Scripture is what the Holy Spirit "spoke
    beforehand" (προεῖπεν) through David, and its fulfilment is necessary
    (ἔδει).

- id: jude-3
  ref: Jude 3, 17
  kjv: JUD 1:3, JUD 1:17
  speaker: apostle
  role: claim
  categories: [transmission]
  object: the faith once delivered
  claim: Contend for the faith which was once delivered unto the saints.
  variants: The editions agree.
  notes: "\"Once\" (ἅπαξ) means once for all. The object is the faith, the body of teaching, not a text. Verse 17 adds \"remember ye the words which were spoken before of the apostles\"."

- id: 2cor-2-17
  ref: 2 Corinthians 2:17; 4:2
  kjv: 2CO 2:17, 2CO 4:2
  speaker: apostle
  role: warning
  categories: [corruption]
  object: the word of God
  claim: We are not as many, which corrupt the word of God; not handling the word of God deceitfully.
  variants: In 2:17 the Byzantine text has "the rest" (οἱ λοιποί) for "many" (οἱ πολλοί).
  notes: |
    "Corrupt" is καπηλεύοντες, "peddling" (used of wine-sellers who
    adulterate their wares); "handling deceitfully" is δολοῦντες,
    "adulterating". Paul admits that some in his day were corrupting the word
    in their handling of it.

- id: 2cor-3-14
  ref: 2 Corinthians 3:14-15
  kjv: 2CO 3:14-15
  speaker: apostle
  role: warning
  categories: [withdrawal]
  object: the old testament as read in the synagogue
  claim: |
    Until this day remaineth the same vail untaken away in the reading of the
    old testament; when Moses is read, the vail is upon their heart.
  variants: The editions agree in substance.
  notes: The text is present and read, but not understood. Compare Isaiah 29:11.

- id: gal-1-8
  ref: Galatians 1:6-9
  kjv: GAL 1:6-9
  speaker: apostle
  role: warning
  categories: [no-alteration, corruption]
  object: the gospel
  claim: |
    Some "would pervert (μεταστρέψαι) the gospel of Christ. But though we, or
    an angel from heaven, preach any other gospel unto you … let him be
    accursed."
  variants: The editions agree.
  notes: |
    The New Testament's counterpart to the prohibitions of Deuteronomy 4:2,
    applied to the gospel preached. Westminster Confession 1.6 and the Formula
    of Concord (Epitome, Rule and Norm 1) cite it.

- id: gal-3-15
  ref: Galatians 3:15, 17
  kjv: GAL 3:15, GAL 3:17
  speaker: apostle
  role: claim
  categories: [inviolability, no-alteration]
  object: a ratified covenant; the promise
  claim: |
    "Though it be but a man's covenant, yet if it be confirmed, no man
    disannulleth (ἀθετεῖ), or addeth thereto (ἐπιδιατάσσεται)"; the law
    "cannot disannul (ἀκυροῖ)" the covenant confirmed before of God.
  variants: In 3:17 SBL lacks "in Christ" (εἰς Χριστόν).
  notes: The add-or-take-away formula and the vocabulary of annulment, applied to God's promise to Abraham.

- id: 2pet-3-16
  ref: 2 Peter 3:16
  kjv: 2PE 3:16
  speaker: apostle
  role: warning
  categories: [corruption]
  object: Paul's epistles and "the other scriptures"
  claim: The unlearned and unstable wrest, as they do also the other scriptures, unto their own destruction.
  variants: Minor; SBL reads "in which" (αἷς, the epistles) for "in which things" (οἷς).
  notes: Corruption by interpretation ("wrest", στρεβλοῦσιν, "twist") rather than by alteration of the text. Paul's letters are counted among "the scriptures".

- id: 1john-2-14
  ref: 1 John 2:14, 24; 2 John 2
  kjv: 1JO 2:14, 1JO 2:24, 2JO 1:2
  speaker: apostle
  role: claim
  categories: [permanence, keeping]
  object: the word of God abiding in you; the truth
  claim: |
    "The word of God abideth in you"; "let that therefore abide in you, which
    ye have heard from the beginning"; "the truth … which dwelleth in us, and
    shall be with us for ever."
  variants: The editions agree in substance; they divide 2:13-14 differently.
  notes: |
    The abiding (μένω) of Isaiah 40:8 and 1 Peter 1:23, located in believers;
    2 John 2 adds "for ever" (εἰς τὸν αἰῶνα).

- id: heb-6-18
  ref: Hebrews 6:17-18; Titus 1:2
  kjv: HEB 6:17-18, TIT 1:2
  speaker: apostle
  role: ground
  categories: [fulfilment]
  object: God's counsel and oath; his promise
  claim: The immutability of his counsel; it was impossible for God to lie; God, that cannot lie, promised.
  variants: The editions agree.

- id: jas-1-18
  ref: James 1:18, 21
  kjv: JAM 1:18, JAM 1:21
  speaker: apostle
  role: claim
  categories: [efficacy]
  object: the word of truth; the engrafted word
  claim: |
    Of his own will begat he us with the word of truth; receive with meekness
    the engrafted word, which is able to save your souls.
  variants: The editions agree.
  notes: Compare 1 Peter 1:23.

- id: rev-22-6
  ref: Revelation 19:9; 21:5; 22:6
  kjv: REV 19:9, REV 21:5, REV 22:6
  speaker: heavenly-voice
  role: claim
  categories: [purity]
  object: these sayings
  claim: '"These are the true sayings of God"; "these words are true and faithful"; "these sayings are faithful and true."'
  variants: In 21:5 the Byzantine and SBL texts read "faithful and true" for "true and faithful". In 22:6 the Textus Receptus has "the Lord God of the holy prophets"; the Byzantine and SBL texts have "the Lord, the God of the spirits of the prophets".
  notes: An angel speaks in 19:9 and 22:6; in 21:5 the command "Write" follows the words of "he that sat upon the throne".

