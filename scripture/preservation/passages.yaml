    ("unto them were committed the oracles of God").

- id: prov-22-19
  ref: Proverbs 22:19-21
  kjv: PRO 22:19-21
  speaker: sage
  role: means
  categories: [inscripturation, purity]
  object: the words of truth
  claim: |
    Have not I written to thee excellent things, that I might make thee know
