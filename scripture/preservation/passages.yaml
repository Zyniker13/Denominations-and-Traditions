# Passages in which Scripture claims that God's Word endures, does not pass
# away, does not fail, is not to be altered, or is kept; together with the
# passages that describe how it was kept and those that admit its corruption
# or loss among men.
#
# This file is the curated input. scripture/preservation/passages.md and
# passages.json are generated from it, with the Hebrew, Greek and English
# texts filled in, by tools/build_preservation.py. Edit this file, then re-run
# the tool; do not edit the generated files by hand.
#
# Fields
#   id          stable identifier, used for links and by other studies
#   ref         display reference, English (KJV) chapter and verse
#   kjv         the same reference in USFM book codes (also used for the NT
#               Greek editions)
#   mt          Masoretic Text reference where its numbering differs
#   lxx         Septuagint reference (Brenton's numbering) where it differs
#               References may be ranges ("PSA 12:6-7") or comma-separated
#               lists ("DEU 10:2, DEU 10:4").
#   speaker     who makes the claim in the text: god, god-through-prophet,
#               jesus, mediator (Moses or a prophet speaking for God in his
#               own voice), psalmist, sage, narrator, apostle, heavenly-voice,
#               other (another named speaker; see the notes)
#   role        claim: asserts something about the Word's endurance,
#                      reliability, or inviolability
#               command: forbids altering it or commands that it be kept
#               means: describes how it is kept (writing, deposit, custody,
#                      restoration, the Spirit's recall)
#               warning: admits or threatens its corruption, perversion,
#                      nullification or withdrawal among men
#               ground: the attribute of God on which the other claims rest
#   categories  one or more of the categories defined in
#               analysis/preservation-of-scripture/README.md
#   object      what the passage says endures (word, words, law, ...)
#   claim       one-line summary of what the passage claims
#   mt_lxx      (OT) how the Hebrew and the Greek differ, where they do
#   variants    (NT) differences among the Greek editions used
#   nt_use      New Testament passages that quote or echo this one
#   notes       anything else the analysis relies on
#
# Notes marked [context] rest on history outside the text quoted. Notes
# marked [inferred] are this study's reading rather than what the text says
# in so many words.

passages:

# ---------------------------------------------------------------- Law

- id: exod-17-14
  ref: Exodus 17:14
  kjv: EXO 17:14
  speaker: god
  role: means
  categories: [inscripturation]
  object: a record of the war with Amalek
  claim: God commands Moses to write a memorial "in a book" (בַּסֵּפֶר) and rehearse it to Joshua.
  mt_lxx: Substantially the same. The Greek names Joshua Ἰησοῦς, the same name as Jesus.
  notes: The first divine command to write in a book. Writing is given as the means of memory across generations.

- id: exod-24-4
  ref: Exodus 24:4, 7, 12; 31:18; 32:15-16
  kjv: EXO 24:4, EXO 24:7, EXO 24:12, EXO 31:18, EXO 32:15-16
  speaker: narrator
  role: means
  categories: [inscripturation]
  object: the words of the LORD; the book of the covenant; the tables
  claim: |
    Moses wrote all the words of the LORD and read the book of the covenant to
    the people; God gave Moses tables of stone "written with the finger of
    God", "the writing of God, graven upon the tables".
  mt_lxx: |
    The same in substance. In 24:12 the Greek reads "which I wrote to give
    them laws" (ἃς ἔγραψα νομοθετῆσαι αὐτοῖς) for "which I have written, that
    thou mayest teach them"; in 32:16 "the writing of God" is ἡ γραφὴ γραφὴ
    Θεοῦ, the noun later used for Scripture.
  notes: |
    Two kinds of writing stand side by side at Sinai: Moses writes "all the
    words of the LORD" in a book (24:4), and God himself writes the tables
    (31:18; 32:16). Verse 24:12 is God speaking: "I will give thee tables of
    stone, and a law, and commandments which I have written". The breaking of
    the first tables (32:19) and their rewriting are in
    [Exodus 34:1](#exod-34-1).

- id: exod-34-1
  ref: Exodus 34:1; Deuteronomy 10:2, 4
  kjv: EXO 34:1, DEU 10:2, DEU 10:4
  speaker: god
  role: means
  categories: [inscripturation, restoration]
  object: the words on the first tables
  claim: After Moses breaks the first tables, God rewrites "the words that were in the first tables" on new ones, "according to the first writing."
  mt_lxx: |
    In Deuteronomy 10:2 the Hebrew has God say "I will write" (וְאֶכְתֹּב); the
    Greek has "thou shalt write" (καὶ γράψεις). Both agree in 10:4 that God
    wrote. Exodus 34:1 in the Greek adds "and come up to me to the mountain"
    (from 34:2 and Deut 10:1).
  notes: |
    The one narrative in which a destroyed autograph is replaced with an
    identical text. The restoration is by God's own act, not by the
    community's copying.

- id: num-23-19
  ref: Numbers 23:19
  kjv: NUM 23:19
  speaker: god-through-prophet
  role: ground
  categories: [fulfilment]
  object: what God has said and spoken
  claim: God is not a man that he should lie; what he has spoken he will make good.
  mt_lxx: |
    The Hebrew: "God is not a man, that he should lie (וִיכַזֵּב) … hath he
    spoken, and shall he not make it stand (יְקִימֶנָּה)?" The Greek: "God is
    not as man to waver (διαρτηθῆναι), nor as the son of man to be threatened
    (ἀπειληθῆναι) … shall he speak and not abide by it (οὐχὶ ἐμμενεῖ)?" The
    Greek turns "lie … repent" into "waver … be threatened", and "establish"
    into "abide by".
  notes: Balaam's oracle, given as the word God "put in his mouth" (23:16).

- id: deut-4-2
  ref: Deuteronomy 4:2; 12:32
  kjv: DEU 4:2, DEU 12:32
  mt: DEU 4:2, DEU 13:1
  lxx: DEU 4:2, DEU 13:1
  speaker: mediator
  role: command
  categories: [no-alteration]
  object: the word Moses commands
  claim: Ye shall not add unto the word, neither diminish from it.
  mt_lxx: |
    The same command in both: לֹא תֹסִפוּ … וְלֹא תִגְרְעוּ / οὐ προσθήσετε …
    οὐκ ἀφελεῖτε. In 4:2 the Greek reads "the Lord our God" for "the LORD your
    God" and adds "this day" (σήμερον). Deuteronomy 12:32 in English Bibles is
    13:1 in the Hebrew and the Greek.
  nt_use: [REV 22:18-19]
  notes: |
    A command to Israel, not a promise. It presupposes that adding and taking
    away are possible. The verbs recur in Revelation 22:18–19 (ἀφαιρέω in
    both; the Greek of Deuteronomy uses προστίθημι for "add", Revelation
    ἐπιτίθημι).

- id: deut-6-6
  ref: Deuteronomy 6:6-9
  kjv: DEU 6:6-9
  speaker: mediator
  role: command
  categories: [transmission, inscripturation]
  object: these words which I command thee this day
  claim: |
    These words shall be in thine heart; teach them diligently unto thy
    children; write them upon the posts of thy house, and on thy gates.
  mt_lxx: |
    The Greek adds "and in thy soul" (6:6) and, for the Hebrew "frontlets
    between thine eyes", has "it shall be immoveable (ἀσάλευτον) before thine
    eyes" (6:8).
  notes: |
    The word is to be kept by being taught to children, spoken of daily, bound
    on the body and written on the house. Transmission is a duty laid on every
    household.

- id: deut-8-3
  ref: Deuteronomy 8:3
  kjv: DEU 8:3
  speaker: mediator
  role: claim
  categories: [efficacy]
  object: every word that proceeds from God's mouth
  claim: Man lives by every word that proceeds out of the mouth of the LORD.
  mt_lxx: |
    The Hebrew has no noun "word": "by everything that proceeds from the mouth
    of the LORD" (כָּל־מוֹצָא פִי־יְהוָה). The Greek supplies one: "by every
    word (παντὶ ῥήματι) that proceeds through the mouth of God." Jesus's
    answer in Matthew 4:4 follows the Greek wording.
  nt_use: [MAT 4:4, LUK 4:4]

- id: deut-17-18
  ref: Deuteronomy 17:18-19
  kjv: DEU 17:18-19
  speaker: mediator
  role: command
  categories: [inscripturation, transmission, custody]
  object: this law
  claim: |
    The king shall write him a copy of this law in a book, out of that which
    is before the priests the Levites, and read therein all the days of his
    life.
  mt_lxx: |
    The Hebrew "a copy (מִשְׁנֵה, 'a second, a repetition') of this law" is
    the Greek "this deuteronomy" (τὸ δευτερονόμιον τοῦτο), "second law"; the
    book's Greek name comes from this verse.
  notes: |
    The only command in Scripture to *copy* the law. The copy is made from
    the exemplar kept by the Levitical priests, so the passage joins
    custody (a master copy in the priests' keeping) to transmission (a new
    copy made from it). **[inferred]** It assumes that copying from the
    authorized exemplar yields the law itself.

- id: deut-18-18
  ref: Deuteronomy 18:18-19
  kjv: DEU 18:18-19
  speaker: god
  role: means
  categories: [transmission]
  object: God's words in the prophet's mouth
  claim: God will put his words in the mouth of a prophet like Moses, and require it of whoever will not hear them.
  mt_lxx: Substantially the same.
  nt_use: [ACT 3:22-23, ACT 7:37, JOH 17:8]
  notes: The model of transmission the prophets and Isaiah 59:21 build on, applied to Christ in Acts 3:22.

- id: deut-18-21
  ref: Deuteronomy 18:21-22; Jeremiah 28:9
  kjv: DEU 18:21-22, JER 28:9
  lxx: DEU 18:21-22, JER 35:9
  speaker: mediator
  role: claim
  categories: [fulfilment]
  object: the word the LORD has spoken
  claim: |
    "When a prophet speaketh in the name of the LORD, if the thing follow not,
    nor come to pass, that is the thing which the LORD hath not spoken"; the
    prophet is known "when the word of the prophet shall come to pass".
  mt_lxx: |
    The same in Deuteronomy. In Jeremiah (Greek 35:9) "the LORD hath truly
    sent" is "whom the Lord sent them in faithfulness" (ἐν πίστει).
  notes: Fulfilment as the test of whether a word is God's. Jeremiah 28:9 is Jeremiah's answer to Hananiah.

- id: deut-27-3
  ref: Deuteronomy 27:2-3, 8
  kjv: DEU 27:2-3, DEU 27:8
  speaker: mediator
  role: command
  categories: [inscripturation]
  object: all the words of this law
  claim: Write upon great plastered stones all the words of this law, "very plainly".
  mt_lxx: |
    "Very plainly" is σαφῶς σφόδρα in the Greek. In 27:8 the Greek reads "all
    this law" for "all the words of this law".
  notes: |
    "Very plainly" is בַּאֵר הֵיטֵב, "making it clear, well". The writing is to be
    legible to all who pass. Joshua carries the command out (Joshua 8:32).

- id: deut-29-29
  ref: Deuteronomy 29:29
  kjv: DEU 29:29
  mt: DEU 29:28
  speaker: mediator
  role: claim
  categories: [transmission]
  object: the things revealed
  claim: The things revealed belong to us and to our children for ever (עַד־עוֹלָם / εἰς τὸν αἰῶνα).
  mt_lxx: |
    The sense is the same. In the Hebrew manuscripts, including the Leningrad
    Codex, the words "unto us and to our children" (לָנוּ וּלְבָנֵינוּ) carry
    *puncta extraordinaria*, scribal dots over the letters; the Greek has no
    counterpart. **[context]** The dots are one of fifteen places where the
    Masoretic tradition marks letters as doubtful or to be read with special
    caution; their meaning was already debated in the rabbinic sources.
  notes: The verse is 29:28 in the Hebrew and 29:29 in Brenton's Greek.

- id: deut-30-11
  ref: Deuteronomy 30:11-14
  kjv: DEU 30:11-14
  speaker: mediator
  role: claim
  categories: [transmission]
  object: this commandment; the word
  claim: |
    The commandment is not in heaven nor beyond the sea; "the word is very
    nigh unto thee, in thy mouth, and in thy heart, that thou mayest do it."
  mt_lxx: |
    The Greek reads "not grievous" (οὐχ ὑπέρογκος, "not too heavy") for "not
    hidden" (לֹא נִפְלֵאת), and adds "and in thy hands" to "in thy mouth and
    in thy heart" (30:14).
  nt_use: [ROM 10:6-8]
  notes: |
    The word does not need to be fetched from a distance; it is already in the
    people's mouth and heart. Paul reads it of the preached word.

- id: deut-31-9
  ref: Deuteronomy 31:9-13
  kjv: DEU 31:9-13
  speaker: mediator
  role: means
  categories: [inscripturation, custody, transmission]
  object: this law
  claim: |
    Moses wrote this law and delivered it to the priests and elders,
    commanding that it be read before all Israel every seventh year, "that
    their children, which have not known any thing, may hear".
  mt_lxx: The Greek reads "the words of this law in a book" for "this law" (31:9).
  notes: |
    Writing, custody by the priests and elders, and public reading at fixed
    intervals are joined in one institution, whose stated purpose is the next
    generation.

- id: deut-31-19
  ref: Deuteronomy 31:19-22
  kjv: DEU 31:19-22
  speaker: god
  role: claim
  categories: [inscripturation, transmission]
  object: this song (Deuteronomy 32)
  claim: |
    Write ye this song, and teach it the children of Israel; "it shall not be
    forgotten out of the mouths of their seed."
  mt_lxx: |
    The Hebrew of 31:21 has "it shall not be forgotten out of the mouth of his
    seed" (לֹא תִשָּׁכַח מִפִּי זַרְעוֹ). The Greek strengthens the negation
    and widens it: "it shall surely not be forgotten (οὐ γὰρ μὴ ἐπιλησθῇ) from
    their mouth and from the mouth of their seed".
  notes: |
    God's own promise that a written and taught text will remain in the
    mouths of Israel's descendants, even when they have turned away; it
    will then "testify against them as a witness". With Isaiah 59:21 this is
    one of two Old Testament promises that God's words will stay in the
    mouth of later generations. Its object is one song, and the promise is
    given as a witness against unfaithfulness.

- id: deut-31-24
  ref: Deuteronomy 31:24-26
  kjv: DEU 31:24-26
  speaker: mediator
  role: means
  categories: [inscripturation, custody]
  object: the book of the law
  claim: Moses writes the law in a book "until they were finished" and has the Levites lay it beside the ark as a witness.
  mt_lxx: The Greek reads "all the words" and "even to the end" (ἕως εἰς τέλος) for the Hebrew "until they were finished" (עַד תֻּמָּם).
  notes: Custody of the written text is assigned to the Levites and its place is the sanctuary.

# ---------------------------------------------------------------- Former Prophets

- id: josh-1-8
  ref: Joshua 1:8
  kjv: JOS 1:8
  speaker: god
  role: command
  categories: [transmission]
  object: the book of the law
  claim: This book of the law shall not depart (לֹא־יָמוּשׁ / οὐκ ἀποστήσεται) out of thy mouth.
  mt_lxx: Substantially the same. The Greek adds "and then thou shalt understand" for "then thou shalt have good success" (תַּשְׂכִּיל, which can mean either).
  notes: |
    A command to Joshua, not a promise; the verb is the one God uses as a
    promise in Isaiah 59:21 ("shall not depart out of thy mouth").

- id: josh-8-32
  ref: Joshua 8:32, 34-35
  kjv: JOS 8:32, JOS 8:34-35
  lxx: JOS 9:2c, JOS 9:2e, JOS 9:2f
  speaker: narrator
  role: means
  categories: [inscripturation, transmission]
  object: the law of Moses
  claim: |
    Joshua wrote on the stones a copy of the law of Moses, and read all the
    words of the law; "there was not a word of all that Moses commanded, which
    Joshua read not" before all the congregation.
  mt_lxx: |
    The Greek places the passage after 9:2 (Brenton's 9:2a-f). "A copy
    (מִשְׁנֵה) of the law" is again τὸ δευτερονόμιον, as in Deuteronomy 17:18.
  notes: |
    The command of Deuteronomy 27 carried out. The narrator stresses
    completeness ("not a word … which Joshua read not").

- id: josh-21-45
  ref: Joshua 21:45; 23:14
  kjv: JOS 21:45, JOS 23:14
  speaker: narrator
  role: claim
  categories: [fulfilment]
  object: the good things the LORD spoke
  claim: There failed not ought of any good thing the LORD had spoken; all came to pass.
  mt_lxx: |
    The Hebrew idiom is "not a word fell" (לֹא־נָפַל דָּבָר). The Greek renders
    it "there fell not" (οὐ διέπεσεν, 21:45; οὐκ ἔπεσεν εἷς λόγος, 23:14) and
    adds in 23:14 "not one of them was discordant" (οὐ διεφώνησεν). 23:14 is
    Joshua's own speech.
  nt_use: [LUK 16:17]
  notes: The "falling" idiom for failure is the background of Luke 16:17 ("one tittle of the law to fall", πεσεῖν).

- id: josh-24-26
  ref: Joshua 24:26
  kjv: JOS 24:26
  speaker: narrator
  role: means
  categories: [inscripturation]
  object: the book of the law of God
  claim: Joshua wrote these words in the book of the law of God.
  mt_lxx: The Greek reads "the book of the laws of God" (βιβλίον νόμων τοῦ Θεοῦ).
  notes: |
    **[inferred]** A writing added to "the book of the law of God" after
    Moses. The book is presented as one that could receive further inspired
    writing, as Jeremiah 36:32 also shows ("there were added besides unto
    them many like words").

- id: 1sam-3-19
  ref: 1 Samuel 3:19
  kjv: 1SA 3:19
  speaker: narrator
  role: claim
  categories: [fulfilment]
  object: Samuel's words (as the LORD's prophet)
  claim: The LORD let none of his words fall to the ground.
  mt_lxx: |
    The Hebrew is causative, with the LORD as subject: "he let none of his
    words fall" (וְלֹא־הִפִּיל). The Greek is intransitive: "there fell not
    any of his words to the ground" (οὐκ ἔπεσεν).

- id: 1sam-10-25
  ref: 1 Samuel 10:25
  kjv: 1SA 10:25
  speaker: narrator
  role: means
  categories: [inscripturation, custody]
  object: the manner of the kingdom
  claim: Samuel told the people the manner of the kingdom, and wrote it in a book, and laid it up before the LORD.
  mt_lxx: The same; the Greek reads "the ordinance of the king" (τὸ δικαίωμα τοῦ βασιλέως).
  notes: A written text deposited "before the LORD", like the book of the law beside the ark (Deuteronomy 31:26).

- id: 2sam-7-25
  ref: 2 Samuel 7:25, 28; 1 Chronicles 17:23
  kjv: 2SA 7:25, 2SA 7:28, 1CH 17:23
  speaker: other
  role: claim
  categories: [fulfilment, purity]
  object: the word God spoke concerning David's house
  claim: '"The word that thou hast spoken … establish it for ever"; "thou art that God, and thy words be true."'
  mt_lxx: |
    For "establish it for ever" (הָקֵם עַד־עוֹלָם) the Greek of 2 Samuel has
    "make it sure for ever" (πίστωσον ἕως τοῦ αἰῶνος), the verb the Hebrew of
    1 Chronicles 17:23 uses (יֵאָמֵן, Greek πιστωθήτω).
  notes: |
    David's prayer after Nathan's oracle. He asks God to "establish for ever"
    (הָקֵם עַד־עוֹלָם) the word, and grounds the request in the truth of God's
    words.

- id: 2sam-22-31
  ref: 2 Samuel 22:31; Psalm 18:30
  kjv: 2SA 22:31, PSA 18:30
  mt: 2SA 22:31, PSA 18:31
  lxx: 2SA 22:31, PSA 17:31
  speaker: psalmist
  role: claim
  categories: [purity]
  object: the word of the LORD
  claim: The word of the LORD is tried (צְרוּפָה, refined as metal).
  mt_lxx: |
    The Hebrew has the singular "word" (אִמְרַת) in both places. The Greek of
    Psalm 17:31 has the plural "oracles" (τὰ λόγια … πεπυρωμένα); the Greek of
    2 Samuel adds "strong": "the word of the Lord is strong, tried" (κραταιὸν
    πεπυρωμένον).

- id: 1kgs-8-24
  ref: 1 Kings 8:20, 24, 26
  kjv: 1KI 8:20, 1KI 8:24, 1KI 8:26
  speaker: other
  role: claim
  categories: [fulfilment]
  object: the word God spoke to David
  claim: |
    "The LORD hath performed his word that he spake"; "thou spakest with thy
    mouth, and hast fulfilled it with thine hand"; "let thy word, I pray thee,
    be verified."
  mt_lxx: |
    The Greek "let thy word be confirmed" (πιστωθήτω δὴ τὸ ῥῆμά σου) renders
    the Hebrew closely; in 8:20 "the LORD hath performed his word" is ἀνέστησε
    Κύριος τὸ ῥῆμα αὐτοῦ, "raised up".
  notes: |
    Solomon's prayer at the dedication of the temple, in the same chapter as
    8:56. "Be verified" is יֵאָמֶן, "be confirmed, prove true", from the root
    of "amen".

- id: 1kgs-8-56
  ref: 1 Kings 8:56
  kjv: 1KI 8:56
  speaker: other
  role: claim
  categories: [fulfilment]
  object: all God's good promise by Moses
  claim: There hath not failed one word of all his good promise.
  mt_lxx: |
    The Hebrew again has "not one word fell" (לֹא־נָפַל דָּבָר אֶחָד); the Greek
    has "not one word was discordant" (οὐ διεφώνησε λόγος εἷς).
    Brenton's Greek book is 3 Kingdoms.
  notes: Solomon is the speaker, at the dedication of the temple.

- id: 2kgs-10-10
  ref: 2 Kings 10:10
  kjv: 2KI 10:10
  speaker: other
  role: claim
  categories: [fulfilment]
  object: the word of the LORD against Ahab's house
  claim: There shall fall unto the earth nothing of the word of the LORD.
  mt_lxx: |
    Same sense. The Greek leaves the Hebrew particle אֵפוֹא untranslated, as
    the transliteration ἀφφώ, a sign of a translator following his Hebrew word
    by word.
  notes: Jehu is the speaker, justifying the slaughter of Ahab's house.

- id: 2kgs-22-8
  ref: 2 Kings 22:8, 11, 13; 23:2-3; 2 Chronicles 34:14-15, 21
  kjv: 2KI 22:8, 2KI 22:11, 2KI 22:13, 2KI 23:2-3, 2CH 34:14-15, 2CH 34:21
  speaker: narrator
  role: means
  categories: [loss, restoration, custody]
  object: the book of the law found in the temple
  claim: |
    Hilkiah the priest found "the book of the law in the house of the LORD";
    when it was read to Josiah he rent his clothes, "because our fathers have
    not hearkened unto the words of this book"; the king read it to all the
    people.
  mt_lxx: |
    The same in substance. Chronicles calls it "a book of the law of the LORD
    given by Moses" (סֵפֶר תּוֹרַת־יְהוָה בְּיַד־מֹשֶׁה, βιβλίον νόμου Κυρίου
    διὰ χειρὸς Μωυσῆ).
  notes: |
    The only narrative in Scripture of a book of God's law lost and found.
    **[inferred]** The narrative presupposes that, in the temple itself and
    under the kings, the book had gone unread and unknown long enough that
    its finding was news and its contents a shock. Its recovery leads to a
    public reading and a covenant renewal. Scripture does not say how long
    it was lost or what else was then extant. **[context]** Which book it
    was, and whether it was the only copy, are debated.

- id: 2chr-9-29
  ref: Numbers 21:14; Joshua 10:13; 2 Samuel 1:18; 1 Kings 11:41; 1 Chronicles 29:29; 2 Chronicles 9:29; 12:15; 13:22
  kjv: NUM 21:14, JOS 10:13, 2SA 1:18, 1KI 11:41, 1CH 29:29, 2CH 9:29, 2CH 12:15, 2CH 13:22
  speaker: narrator
  role: means
  categories: [loss]
  object: books cited by the biblical writers, including writings of prophets
  claim: |
    The historical books cite other writings, among them "the book of the wars
    of the LORD", "the book of Jasher", "the book of Nathan the prophet", "the
    prophecy of Ahijah", "the visions of Iddo the seer", and "the book of
    Shemaiah the prophet".
  mt_lxx: |
    The Greek of Numbers 21:14 has no title "the book of the wars of the
    LORD"; it reads "it is said in a book, The war of the Lord …" (ἐν βιβλίῳ,
    πόλεμος τοῦ Κυρίου), making the phrase the start of the quotation. The
    Greek of Joshua 10:13 lacks "Is not this written in the book of Jasher?";
    2 Samuel 1:18 has it ("the book of the upright", βιβλίου τοῦ εὐθοῦς). In 2
    Chronicles 9:29 the Greek names the seer Joel (Ἰωήλ) for Iddo.
  notes: |
    **[context]** None of these writings is extant, and none is in any
    canon. Several are ascribed to prophets (Nathan, Gad, Ahijah, Iddo,
    Shemaiah). **[inferred]** Scripture therefore records writings by
    prophets that were not preserved. Whether any of them was the word of
    God in the sense of the canonical books Scripture does not say; it cites
    them as sources, not as Scripture.

- id: neh-8-8
  ref: Ezra 7:6, 10; Nehemiah 8:1-3, 8
  kjv: EZR 7:6, EZR 7:10, NEH 8:1-3, NEH 8:8
  lxx: EZR 7:6, EZR 7:10, EZR 18:1-3, EZR 18:8
  speaker: narrator
  role: means
  categories: [transmission, restoration]
  object: the book of the law of Moses
  claim: |
    Ezra, "a ready scribe in the law of Moses", brought the book of the law
