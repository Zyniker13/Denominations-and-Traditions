studies:
  - id: canon-in-the-confessions
    title: The Canon of Scripture in the Reformed Confessions and the Book of Concord
    path: analysis/canon-in-the-confessions.md
    tracked: true
    scope: What each confession says about the canon, the Apocrypha, the Hebrew text and the Greek versions
    covers: [belgic, heidelberg, dort, scots, thirty-nine-articles, wcf, wlc, wsc,
             form-of-government, directory-publick-worship, savoy, lbc,
             boc-preface, boc-creeds, augsburg, apology, smalcald, treatise,
             small-catechism, large-catechism, fc-epitome, fc-solid-declaration]
    also: [french, first-helvetic, second-helvetic, helvetic-consensus, irish-articles]
  - id: canon-in-the-theologians
    title: The Canon of Scripture in the Theologians
    path: analysis/canon-in-the-theologians.md
    covers: []
    collections: [theologians]
    scope: What the theologians and teachers in theologians/ say about the canon and the text
  - id: preservation-of-scripture
    title: The Preservation of Scripture in Scripture and in the Confessions
    path: analysis/preservation-of-scripture/README.md
    covers: [all-confessions]
    also: [helvetic-consensus, irish-articles]
    collections: [preservation-passages]
    tracked: true
    scope: Scripture's claims that God's word endures, categorized and assessed, with every confession measured against them
  - id: preservation-hebrew-and-greek
    title: "Preserved in Hebrew or in Greek? Scripture's Preservation Claims Tested Against the History of Its Text"
    path: analysis/preservation-hebrew-and-greek.md
    covers: [wcf, savoy, lbc, belgic, heidelberg, dort, scots, thirty-nine-articles,
             boc-preface, augsburg, apology, smalcald, treatise, small-catechism,
             large-catechism, fc-epitome, fc-solid-declaration]
    also: [helvetic-consensus, french, irish-articles]
    collections: [preservation-passages]
    tracked: true
    scope: The strength of the preservation claims grounded in the Hebrew text or in the Septuagint; section 9 covers only the confessions' claims about the Hebrew and Greek text
  - id: god-quoting-scripture
    title: God Quoting Scripture
    path: analysis/god-quoting-scripture/README.md
    covers: []
    collections: [divine-quotations]
    scope: Every place where God, the Father, the Son or the Spirit, quotes earlier Scripture, counted by type and compared with the Septuagint, its other witnesses and the Hebrew
  - id: heaven-and-resurrection
    title: Heaven, the New Earth and the Resurrection of the Body
    path: analysis/heaven-and-resurrection/README.md
    covers: [all-confessions]
    collections: [theologians, last-things-passages]
    tracked: true
    scope: The historical Reformed teaching on the third heaven, the final destination of the Christian, the new heavens and earth and the resurrection of the flesh, set against the Greek and Hebrew, the Jewish sources and the orthodox Lutherans
