# Catalog of the repository: every confessional document, every collection of
# other source texts, and every study, with the documents each study covers.
#
# INDEX.md is generated from this file by tools/build_index.py, and
# tools/build_preservation.py reads the documents listed here to find the
# confessions' citations of the preservation passages.
#
# When a confession is added:
#   1. Add it under `documents` (with `scan: true` if its Scripture citations
#      should be found by the tools).
#   2. Run `python3 tools/build_preservation.py` and `python3 tools/build_index.py`.
#   3. INDEX.md then shows, under "Coverage", every study that does not yet
#      cover the new document. Update those studies, then add the document's
#      id to each study's `covers` list and run tools/build_index.py again.
#
# Document fields
#   id         short stable identifier
#   title      display title with date
#   tradition  grouping used in the index
#   kind       confession | catechism | creed | church-order | companion
#              (companion documents are printed with a standard but are not
#              themselves confessions; studies are not expected to cover them)
#   path       file in this repository, or omitted if the document is not here
#   scan       true if tools should scan the file for Scripture citations
#
# Study fields
#   id, title, path
#   covers       document ids the study examines; `all-confessions` stands
#                for every document of kind confession, catechism or creed
#                that is in the repository
#   also         documents the study discusses that are not in the repository
#   collections  collections the study draws on
#   tracked      true if the study is meant to cover every confession; INDEX.md
#                then lists the confessions it does not yet cover
#   scope        one line on what the study covers, shown in INDEX.md

